<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalkulačka většího bytu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Základní kalkulačka: profily nemovitostí nahoře, vstupy vlevo, výsledky vpravo. Jen částky v Kč. */
:root{
  --bg:#cfd5d1;--surface:#e3e7e4;--field:#d2d8d4;--ink:#141a18;--muted:#46524d;--line:#b3bcb7;
  --a:#0f766e;--b:#b45309;--c:#4f46e5;--d:#64748b;--good:#15803d;--bad:#b91c1c;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f0e;--surface:#111917;--field:#1a2421;--ink:#e8eeec;--muted:#93a29c;--line:#26312e;
  --a:#2dd4bf;--b:#fbbf24;--c:#a5b4fc;--d:#94a3b8;--good:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f0e;--surface:#111917;--field:#1a2421;--ink:#e8eeec;--muted:#93a29c;--line:#26312e;
  --a:#2dd4bf;--b:#fbbf24;--c:#a5b4fc;--d:#94a3b8;--good:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
h1{font-family:var(--cond);font-weight:600;font-size:28px;margin:6px 0 0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:64ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button:hover{background:var(--field)}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:8px;padding:14px 16px;min-width:0}
.card.A{--k:var(--a)}.card.B{--k:var(--b)}.card.C{--k:var(--c)}.card.D{--k:var(--d)}
.card h3{margin:0;font-family:var(--cond);font-size:17px;font-weight:600}
.card .d{color:var(--muted);font-size:13px;margin-bottom:8px}
.card .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@supports (grid-template-rows:subgrid){.card{display:grid;grid-template-rows:subgrid;grid-row:span 6;row-gap:0;align-content:start}}
.big{font-size:28px;font-weight:700;line-height:1.15}
.small{font-size:13px;color:var(--muted);margin-top:4px}
.main{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:0;padding:6px 14px 10px;min-width:0}
fieldset.prof{border-color:var(--ink);border-width:2px}
legend{font-family:var(--cond);font-weight:600;font-size:16px;padding:0 6px}
details.common{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.common>summary{cursor:pointer;font-family:var(--cond);font-weight:600;font-size:16px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px}
details.common>summary .tot{font-family:var(--font);font-variant-numeric:tabular-nums}
details.common>div{display:flex;flex-direction:column;gap:12px;padding:0 10px 12px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f .l{font-size:13.5px;line-height:1.3;min-width:0}
.f .in{display:flex;align-items:center;background:var(--field);border-radius:6px;flex:0 0 160px}
.f input{width:100%;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:500;text-align:right;padding:8px 6px 8px 10px}
.f input.txt{text-align:left}
.f.col{flex-direction:column;align-items:stretch}
.f.col .in{flex:1 1 auto}
.f .u{color:var(--muted);font-size:12px;padding-right:9px;white-space:nowrap}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 2px}
.pbtns button{padding:7px 12px;font-size:13px}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0 2px}
h2{font-family:var(--cond);font-weight:600;font-size:19px;margin:0 0 8px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-family:var(--cond);font-weight:600;font-size:14px;border-bottom:2px solid var(--line)}
thead th i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--k);margin-right:6px}
tr.sec td{background:var(--field);font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:5px}
tr.sm td{font-size:12px;color:var(--muted);padding-block:4px;border-bottom-color:transparent}
tr.sm td:first-child{padding-left:24px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.pick{cursor:pointer}
tr.pick:hover td,tr.pick.on td{background:var(--field)}
tr.pick.on td{font-weight:700}
tr:last-child td{border-bottom:0}
td.bc{width:150px;min-width:110px}
.bar{display:block;height:8px;border-radius:4px;background:var(--k,var(--d));min-width:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
svg{display:block;width:100%;height:auto}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.verdict p{margin:0 0 6px}.verdict p:last-child{margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
.sumbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sumbox h2{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:8px;padding:10px 12px}
.tile.A{--k:var(--a)}.tile.B{--k:var(--b)}.tile.C{--k:var(--c)}.tile.D{--k:var(--d)}
.tile .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big2{font-size:21px;font-weight:700;line-height:1.2;margin-top:2px}
.badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600}
.facts{margin:0;padding-left:18px}.facts li{margin:3px 0}
.opinion{border-left:4px solid var(--ink);background:var(--bg);border-radius:0 8px 8px 0;padding:10px 14px}
.opinion h3{margin:0 0 6px;font-family:var(--cond);font-size:17px}
.opinion p{margin:0 0 8px}.opinion p:last-child{margin:0}
.why{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-right:6px;border:1px solid var(--muted);border-radius:50%;color:var(--muted);font:600 9px/1 var(--font);cursor:help;vertical-align:middle;opacity:.65;font-style:normal}
.why:hover,.why:focus-visible,.why.on{opacity:1;color:var(--ink);border-color:var(--ink)}
.card .why{margin:0 0 0 8px}
#tip{position:fixed;z-index:20;max-width:360px;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:12.5px;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none;display:none}
#tip b{display:block;margin-bottom:6px;font-size:13px}
#tip .r{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
#tip .r span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
#tip .r.sum{border-top:1px solid currentColor;margin-top:4px;padding-top:5px;font-weight:700}
#tip .r.dim{opacity:.8}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .f .in{flex-basis:140px}
}
</style></head><body>

<div class="wrap">
  <header>
    <div>
      <nav id="nav" aria-label="Stránky"></nav>
      <h1>Kalkulačka většího bytu</h1>
      <p class="sub">Vyber nebo přidej nemovitost ke koupi. Ukáže se, kolik ti měsíčně i ročně zbývá, když starý byt prodáš, pronajmeš, nebo zůstaneš. Společné údaje, výdaje a profily se sdílejí s komplexní kalkulačkou.</p>
    </div>
    <div class="btns">
      <button id="demo" type="button">Vrátit ukázku</button>
      <button id="share" type="button">Zkopírovat odkaz s mými čísly</button>
    </div>
  </header>

  <div id="chips"></div>
  <p class="note" id="status"></p>
  <section class="cards" id="cards" aria-label="Výsledek vybraného profilu"></section>

  <div class="main">
    <div class="panel" id="inputs"></div>
    <div class="panel" id="out"></div>
  </div>
</div>

<div id="tip" role="tooltip"></div>
<script src="shared.js"></script>
<script>
(function(){
var B=BYD,st=B.st,kc=B.kc,fmtIn=B.fmtIn,parse=B.parse,sgn=B.sgn,esc=B.esc;
var NAMES={D:'Dnes',A:'Prodat a koupit',B:'Koupit a pronajímat',C:'Zůstat'};
var TIPS=[];
var ORDER=['D','C','A','B'];
var cardsEl=document.getElementById('cards'),outEl=document.getElementById('out'),inEl=document.getElementById('inputs');
B.mountNav(document.getElementById('nav'),'index');

function bars(vals,title,aria){
  var mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([0]));
  var W=520,L=150,Rr=110,bh=26,gap=16,H=vals.length*(bh+gap)+8;
  var sc=(W-L-Rr)/(mx-mn||1),x0=L-mn*sc;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+aria+'"><line x1="'+x0+'" x2="'+x0+'" y1="0" y2="'+H+'" stroke="var(--line)"/>';
  ORDER.forEach(function(k,i){
    var v=vals[i],y=4+i*(bh+gap),w=Math.abs(v)*sc,x=v>=0?x0:x0-w;
    svg+='<text x="0" y="'+(y+bh/2+5)+'" font-size="13" fill="var(--ink)" font-family="var(--font)">'+NAMES[k]+'</text>';
    svg+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(w,1)+'" height="'+bh+'" rx="3" fill="var(--'+k.toLowerCase()+')"/>';
    var tx=v>=0?x0+w+6:x0+6;
    svg+='<text x="'+tx+'" y="'+(y+bh/2+5)+'" font-size="13" font-weight="600" fill="var(--ink)" font-family="var(--font)">'+kc(v)+'</text>';
  });
  return '<div class="chart"><h2>'+title+'</h2>'+svg+'</svg></div>';
}

function render(){
  var P=B.cur(),R=B.calc(P),S=R.s,ann=R.ann;
  TIPS=[];
  function fp(r){return fmtIn(r,2)+' %';}
  function yrs(v){return fmtIn(Math.round(v*10)/10,1)+' let';}
  function T(title,rows){TIPS.push({t:title,r:rows});return '<span class="why" tabindex="0" role="button" aria-label="Ukázat výpočet" data-t="'+(TIPS.length-1)+'">i</span>';}
  function leftTip(x){return T('Zbývá měsíčně',[['Čistý příjem domácnosti',kc(S.income)],['− ostatní měsíční výdaje',kc(-S.other)],['− bydlení celkem',kc(-x.housing)],['Zbývá měsíčně',kc(x.left),'sum']]);}
  function yearTip(x){return T('Zbývá za rok',[['Příjem za rok (12 ×)',kc(S.income*12)],['− měsíční výdaje za rok',kc(-S.other*12)],['− bydlení za rok',kc(-x.housing*12)],['− roční výdaje',kc(-ann)],['Zbývá za rok',kc(x.yearLeft),'sum']]);}
  function houseTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Zálohy a energie nového bytu',x.serv],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns],['Zálohy, energie a garáž starého bytu',x.oldServ]].forEach(function(a){if(a[1])rows.push([a[0],kc(a[1])]);});
    if(x.rent)rows.push(['− příjem z pronájmu po nákladech',kc(-x.rent)]);
    rows.push(['Bydlení celkem',kc(x.housing),'sum']);return T('Bydlení celkem za měsíc',rows);
  }
  function houseYearTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Zálohy a energie nového bytu',x.serv],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns],['Zálohy, energie a garáž starého bytu',x.oldServ]].forEach(function(a){if(a[1])rows.push([a[0]+' (12 ×)',kc(a[1]*12)]);});
    if(x.rent)rows.push(['− příjem z pronájmu po nákladech (12 ×)',kc(-x.rent*12)]);
    rows.push(['Bydlení za rok',kc(x.housing*12),'sum']);return T('Bydlení celkem za rok',rows);
  }
  function hypTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns]].forEach(function(a){if(a[1])rows.push([a[0],kc(a[1])]);});
    rows.push(['Splátky všech hypoték',kc(x.pay+x.ins+x.oldPay+x.oldIns),'sum']);return T('Splátky všech hypoték vč. pojištění',rows);
  }
  function newPayTip(k,x){
    var rows=[['Kupní cena',kc(S.price)],['+ vybavení a náklady po koupi',kc(S.reno)]];
    if(k==='A'){rows.push(['− z prodeje starého bytu (cena − náklady − zbývající hypotéka)',kc(-R.cash)]);rows.push(['− vlastní peníze',kc(-S.usedA)]);}
    else rows.push(['− vlastní peníze',kc(-S.usedB)]);
    rows.push(['Výše hypotéky',kc(x.loan),'sum']);
    rows.push(['Úrok '+fp(k==='A'?S.rateA:S.rateB)+', splatnost '+S.term+' let','','dim']);
    rows.push(['Měsíční splátka',kc(x.pay),'sum']);
    return T('Splátka nové hypotéky',rows);
  }
  function oldPayTip(k,x){
    var rows;
    if(k==='D')rows=[['Zůstatek hypotéky dnes',kc(S.oldBal)],['Úrok dnes',fp(S.oldRate)],['Zbývající splatnost',yrs(S.oldYears)],['Měsíční splátka',kc(R.payNow),'sum']];
    else{var m=Math.max(0,Math.min(S.monthsFix,S.oldYears*12));rows=[['Zůstatek hypotéky dnes',kc(S.oldBal)],['Zůstatek po '+S.monthsFix+' měsících (konec fixace)',kc(R.balFix)],['Úrok po refixaci',fp(S.rateAfter)],['Zbývající splatnost po refixaci',yrs(S.oldYears-m/12)],['Měsíční splátka',kc(R.oldPay),'sum']];}
    return T('Splátka staré hypotéky',rows);
  }
  function rentTip(){
    var rM=S.rent*S.occ/12;
    return T('Příjem z pronájmu po nákladech',[['Nájem '+kc(S.rent)+' × '+S.occ+' z 12 měsíců',kc(rM)],['− poplatky SVJ, které platí vlastník',kc(-S.owner)],['− opravy a drobné náklady',kc(-S.repairs)],['− daň z nájmu',kc(-S.tax)],['Čistý příjem za měsíc',kc(rM-S.owner-S.repairs-S.tax),'sum']]);
  }
  var best=R.A.left===R.B.left?'':(R.A.left>R.B.left?'A':'B');
  var desc={
    A:'Nová hypotéka '+kc(R.A.loan),
    D:'Starý byt, hypotéka '+kc(S.oldBal),
    B:'Nová hypotéka '+kc(R.B.loan)+' a stará '+kc(R.balFix),
    C:'Jen stará hypotéka '+kc(R.balFix)
  };
  var h='';
  ORDER.forEach(function(k){
    var x=R[k];
    h+='<div class="card '+k+'"><h3>'+NAMES[k]+'</h3><div class="d">'+desc[k]+'</div>'+
       '<div class="cap">Zbývá měsíčně</div><div class="big '+sgn(x.left)+'">'+kc(x.left)+leftTip(x)+'</div>'+
       '<div class="small">Bydlení celkem '+kc(x.housing)+(k===best?' · z koupě vychází líp':'')+'</div>'+
       '<div class="small">Po ročních výdajích <b class="'+sgn(x.yearLeft)+'">'+kc(x.yearLeft)+'</b>'+yearTip(x)+' za rok, '+kc(x.yearMonthly)+' měsíčně</div></div>';
  });
  cardsEl.innerHTML=h;

  var t='';
  /* porovnání profilů */
  t+='<div><h2>Porovnání nemovitostí</h2><div class="scroll"><table style="min-width:0"><thead><tr><th>Nemovitost</th><th>Cena</th>'+
    '<th style="--k:var(--a)"><i></i>Prodat a koupit</th><th style="--k:var(--b)"><i></i>Koupit a pronajímat</th></tr></thead><tbody>';
  st.profiles.forEach(function(p){
    var r=B.calc(p);
    t+='<tr class="pick'+(p.id===P.id?' on':'')+'" data-id="'+p.id+'" tabindex="0"><td>'+esc(p.name)+'</td><td>'+kc(p.v.price)+'</td>'+
       '<td><span class="'+sgn(r.A.left)+'">'+kc(r.A.left)+'</span><div class="small">za rok '+kc(r.A.yearLeft)+'</div><div class="small">hypotéka '+kc(r.A.loan)+'</div></td>'+
       '<td><span class="'+sgn(r.B.left)+'">'+kc(r.B.left)+'</span><div class="small">za rok '+kc(r.B.yearLeft)+'</div><div class="small">hypotéka '+kc(r.B.loan)+'</div></td></tr>';
  });
  t+='</tbody></table></div><p class="note" style="margin-top:6px">Zbývá měsíčně před ročními výdaji, pod tím za rok po nich. Dnes '+kc(R.D.left)+' měsíčně (za rok '+kc(R.D.yearLeft)+'), při setrvání po refixaci '+kc(R.C.left)+' (za rok '+kc(R.C.yearLeft)+'). Kliknutím na řádek nemovitost vybereš.</p></div>';

  /* měsíční rozpočet */
  t+='<div><h2>Měsíční rozpočet: '+esc(P.name)+'</h2><div class="scroll"><table><thead><tr><th></th>'+
    ORDER.map(function(k){return '<th style="--k:var(--'+k.toLowerCase()+')"><i></i>'+NAMES[k]+'</th>';}).join('')+'</tr></thead><tbody>';
  function tr(l,fn,cls){t+='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+ORDER.map(function(k){return '<td>'+fn(R[k],k)+'</td>';}).join('')+'</tr>';}
  function sec(l){t+='<tr class="sec"><td colspan="5">'+l+'</td></tr>';}
  function dash(v){return v?kc(v):'–';}
  sec('Příjem a výdaje');
  tr('Čistý příjem domácnosti',function(){return kc(S.income);});
  tr('Ostatní výdaje (součet z rozpisu)',function(){return kc(-S.other);});
  sec('Nový byt');
  tr('Splátka nové hypotéky',function(x,k){return x.pay?newPayTip(k,x)+kc(x.pay):'–';});
  tr('Pojištění nové hypotéky',function(x){return dash(x.ins);});
  tr('Zálohy, energie a pojištění bytu',function(x){return dash(x.serv);});
  sec('Starý byt');
  tr('Splátka staré hypotéky',function(x,k){return x.oldPay?oldPayTip(k,x)+kc(x.oldPay):'–';});
  tr('Pojištění staré hypotéky',function(x){return dash(x.oldIns);});
  tr('Zálohy, energie a garáž',function(x){return dash(x.oldServ);});
  tr('Součet před odečtením pronájmu',function(x){return kc(x.housing+x.rent);});
  tr('Příjem z pronájmu po nákladech',function(x){return x.rent?rentTip()+kc(-x.rent):'–';});
  tr('Bydlení celkem',function(x){return houseTip(x)+kc(x.housing);},'tot');
  tr('Zbývá měsíčně',function(x){return leftTip(x)+'<span class="'+sgn(x.left)+'">'+kc(x.left)+'</span>';},'tot');
  sec('Dluh a úspory');
  tr('Dluh celkem',function(x){return kc(x.debt);});
  tr('Úspory po koupi',function(x){return '<span class="'+(x.savLeft<0?'neg':'')+'">'+kc(x.savLeft)+'</span>';});
  function hyp(x){return x.pay+x.ins+x.oldPay+x.oldIns;}
  function sm(l,fn){t+='<tr class="sm"><td>'+l+'</td>'+ORDER.map(function(k){var v=fn(R[k],k);return '<td>'+(v===null?'–':(v>=0?'+':'−')+kc(Math.abs(v)))+'</td>';}).join('')+'</tr>';}
  sec('Hypotéky a rozdíly');
  tr('Splátky všech hypoték vč. pojištění',function(x){return hypTip(x)+kc(hyp(x));});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:hyp(x)-hyp(R.D);});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:hyp(x)-hyp(R.A);});
  tr('Dluh na všech hypotékách',function(x){return kc(x.debt);});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.debt-R.D.debt;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.debt-R.A.debt;});
  tr('Zbývá měsíčně',function(x){return leftTip(x)+'<span class="'+sgn(x.left)+'">'+kc(x.left)+'</span>';});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.left-R.D.left;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.left-R.A.left;});
  t+='</tbody></table></div></div>';

  /* roční přehled */
  t+='<div><h2>Roční přehled: '+esc(P.name)+'</h2><div class="scroll"><table><thead><tr><th></th>'+
    ORDER.map(function(k){return '<th style="--k:var(--'+k.toLowerCase()+')"><i></i>'+NAMES[k]+'</th>';}).join('')+'</tr></thead><tbody>';
  sec('Za celý rok');
  tr('Čistý příjem domácnosti',function(){return kc(S.income*12);});
  tr('Měsíční výdaje domácnosti',function(){return kc(-S.other*12);});
  tr('Bydlení celkem',function(x){return houseYearTip(x)+kc(-x.housing*12);});
  tr('Roční výdaje (pojistky, dovolená, Vánoce, servis…)',function(){return kc(-ann);});
  tr('Zbývá za rok na investice a rezervu',function(x){return yearTip(x)+'<span class="'+sgn(x.yearLeft)+'">'+kc(x.yearLeft)+'</span>';},'tot');
  tr('Z toho v průměru měsíčně',function(x){return '<span class="'+sgn(x.yearMonthly)+'">'+kc(x.yearMonthly)+'</span>';});
  sm('rozdíl za rok oproti dnes',function(x,k){return k==='D'?null:x.yearLeft-R.D.yearLeft;});
  sm('rozdíl za rok oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.yearLeft-R.A.yearLeft;});
  t+='</tbody></table></div><p class="note" style="margin-top:6px">Z toho, co zbývá, se dá spořit, investovat do akcií a tvořit polštář na nečekané věci. Rezerva na spotřebiče je už v ročních výdajích. Úspory po koupi: '+kc(R.A.savLeft)+' (prodat) a '+kc(R.B.savLeft)+' (pronajmout).</p></div>';
  t+=bars(ORDER.map(function(k){return R[k].yearLeft;}),'Kolik zbývá za rok','Kolik zbývá za rok v jednotlivých variantách');

  /* rozpis výdajů */
  var maxY=1,i;
  for(i=0;i<B.EXP.length;i++)maxY=Math.max(maxY,st.exp[B.EXP[i][0]]*12);
  for(i=0;i<B.ANN.length;i++)maxY=Math.max(maxY,st.ann[B.ANN[i][0]]);
  function xr(l,m,y,c){return '<tr><td>'+l+'</td><td>'+kc(m)+'</td><td>'+kc(y)+'</td><td class="bc"><span class="bar" style="--k:var(--'+c+');width:'+Math.max(2,Math.round(y/maxY*100))+'%"></span></td></tr>';}
  t+='<div><h2>Rozpis výdajů domácnosti mimo bydlení</h2><div class="scroll"><table><thead><tr><th></th><th>Měsíčně</th><th>Ročně</th><th></th></tr></thead><tbody>';
  t+='<tr class="sec"><td colspan="4">Měsíční výdaje</td></tr>';
  B.EXP.forEach(function(e){var v=st.exp[e[0]];if(v)t+=xr(e[1],v,v*12,'a');});
  t+='<tr class="tot"><td>Měsíční výdaje celkem</td><td>'+kc(S.other)+'</td><td>'+kc(S.other*12)+'</td><td></td></tr>';
  t+='<tr class="sec"><td colspan="4">Roční výdaje</td></tr>';
  B.ANN.forEach(function(e){var v=st.ann[e[0]];if(v)t+=xr(e[1],v/12,v,'b');});
  t+='<tr class="tot"><td>Roční výdaje celkem</td><td>'+kc(ann/12)+'</td><td>'+kc(ann)+'</td><td></td></tr>';
  t+='<tr class="tot"><td>Výdaje domácnosti celkem (bez bydlení)</td><td>'+kc(S.other+ann/12)+'</td><td>'+kc(S.other*12+ann)+'</td><td></td></tr>';
  t+='</tbody></table></div><p class="note" style="margin-top:6px">Roční výdaje jsou ve sloupci Měsíčně rozpočítané na dvanáct měsíců. Spoření a investice tu nejsou, jsou součástí toho, co zbývá.</p></div>';

  /* rozpis pronájmu */
  var rM=S.rent*S.occ/12,rY=S.rent*S.occ,opM=S.owner+S.repairs+S.tax,netBefore=rM-opM,mort=R.oldPay+S.oldInsAfter,netAfter=netBefore-mort;
  function row(l,mv,cls,neg){var v=neg?-mv:mv;var c=cls&&v<0?'neg':cls?'pos':'';return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td><td><span class="'+c+'">'+kc(v)+'</span></td><td><span class="'+c+'">'+kc(v*12)+'</span></td></tr>';}
  var tenSvj=Math.max(0,S.svjTotal-S.owner);
  t+='<div><h2>Pronájem starého bytu: rozpis</h2><div class="scroll"><table><thead><tr><th></th><th>Měsíčně</th><th>Ročně</th></tr></thead><tbody>';
  t+='<tr class="sec"><td colspan="3">Rozdělení záloh SVJ ('+kc(S.svjTotal)+' měsíčně)</td></tr>';
  t+='<tr><td>Platí vlastník, počítá se do nákladů pronájmu</td><td>'+kc(S.owner)+'</td><td>'+kc(S.owner*12)+'</td></tr>';
  t+='<tr><td>Platí nájemník nad rámec nájmu, tvým rozpočtem neprochází</td><td>'+kc(tenSvj)+'</td><td>'+kc(tenSvj*12)+'</td></tr>';
  t+='<tr class="sec"><td colspan="3">Příjem a náklady pronájmu</td></tr>';
  t+='<tr><td>Nájem '+kc(S.rent)+' × '+S.occ+' měsíců z 12</td><td>'+kc(rM)+'</td><td>'+kc(rY)+'</td></tr>';
  t+=row('Poplatky SVJ, které platí vlastník',S.owner,'',true)+row('Opravy a drobné náklady',S.repairs,'',true)+row('Daň z nájmu (odhad)',S.tax,'',true);
  t+=row('Příjem z pronájmu po nákladech',netBefore,'tot');
  t+='<tr class="sec"><td colspan="3">Hypotéka na starém bytě po refixaci</td></tr>';
  t+=row('Splátka hypotéky',R.oldPay,'',true)+row('Pojištění hypotéky',S.oldInsAfter,'',true);
  t+=row(netAfter>=0?'Pronájem ti měsíčně přispívá':'Na pronájem měsíčně doplácíš',netAfter,'tot');
  t+='</tbody></table></div><p class="note" style="margin-top:6px">Zálohy a energie ve starém bytě platí nájemník, proto tu nejsou. Pronájem je stejný pro všechny nemovitosti.</p></div>';

  t+=bars(ORDER.map(function(k){return R[k].left;}),'Kolik zbývá měsíčně: '+esc(P.name),'Kolik zbývá měsíčně v jednotlivých variantách');

  /* shrnutí a můj názor */
  var Dd=R.D,bestK=R.A.yearLeft>=R.B.yearLeft?'A':'B',bx=R[bestK],other=bestK==='A'?'B':'A';
  function sd(v){return (v>=0?'+':'−')+kc(Math.abs(v));}
  function pctOf(x){return Dd.yearLeft>0?Math.round(x.yearLeft/Dd.yearLeft*100):null;}
  var tiles=['D','C','A','B'].map(function(k){
    var x=R[k];
    return '<div class="tile '+k+'"><div class="cap">'+NAMES[k]+'</div><div class="big2 '+sgn(x.yearLeft)+'">'+kc(x.yearLeft)+'</div>'+
      '<div class="small">zbývá za rok, '+kc(x.yearMonthly)+' měsíčně</div>'+
      (k==='D'?'<div class="small">výchozí stav</div>':'<div class="small">oproti dnes '+sd(x.yearLeft-Dd.yearLeft)+' ročně</div>')+
      ((k==='A'||k==='B')&&k===bestK?'<div class="badge">z koupě vychází líp</div>':'')+'</div>';
  }).join('');
  var facts='<ul class="facts">'+
    '<li>Splátka staré hypotéky po refixaci vzroste z <b>'+kc(R.payNow)+'</b> na <b>'+kc(R.oldPay)+'</b> měsíčně.</li>'+
    '<li>Z prodeje starého bytu zbude po doplacení hypotéky a nákladech <b>'+kc(R.cash)+'</b>. Nový byt s vybavením stojí <b>'+kc(S.price+S.reno)+'</b>.</li>'+
    '<li>Dnes ti po měsíčních výdajích zbývá <b>'+kc(Dd.left)+'</b>, po ročních výdajích <b>'+kc(Dd.yearLeft)+'</b> za rok.</li>'+
    '<li>Při pronájmu je dluh o <b>'+kc(Math.abs(R.B.debt-R.A.debt))+'</b> '+(R.B.debt>=R.A.debt?'vyšší':'nižší')+' než při prodeji a zbývá o <b>'+kc(Math.abs(R.B.yearLeft-R.A.yearLeft))+'</b> ročně '+(R.B.yearLeft>=R.A.yearLeft?'víc':'méně')+'.</li></ul>';
  /* názor podle čísel */
  var op=[];
  var nm=bestK==='A'?'prodej starého bytu':'pronájem starého bytu';
  if(bx.yearLeft<0){
    op.push('Podle těchto čísel <b>nevychází ani jedna varianta</b>: po všech výdajích jsi i v nejlepším případě v mínusu <b>'+kc(-bx.yearLeft)+'</b> ročně. Je potřeba levnější byt, větší vlastní vklad nebo nižší výdaje.');
  }else{
    var pc=pctOf(bx);
    op.push('Podle čísel vychází líp <b>'+nm+'</b>. Po všech výdajích ti zbude <b>'+kc(bx.yearLeft)+'</b> ročně ('+kc(bx.yearMonthly)+' měsíčně)'+(pc!==null?', tedy asi <b>'+pc+' %</b> dnešního přebytku':'')+'. Dnes ti zbývá '+kc(Dd.yearLeft)+', takže životní standard se posune o <b>'+kc(Math.abs(bx.yearLeft-Dd.yearLeft))+'</b> ročně '+(bx.yearLeft>=Dd.yearLeft?'nahoru':'dolů')+'.');
    if(bx.yearMonthly<10000)op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně je <b>tenký</b>. Jeden nečekaný větší výdaj (auto, oprava, výpadek příjmu) ho smaže, takže na investice nezbyde nic.');
    else if(bx.yearMonthly<30000)op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně vystačí na rezervu a drobné investice, ale na větší spoření už moc ne.');
    else op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně je solidní, vedle rezervy zůstane i na pravidelné investice.');
  }
  if(R.B.yearLeft!==R.A.yearLeft){
    var dd=Math.abs(R.B.yearLeft-R.A.yearLeft);
    if(bestK==='A')op.push('Pronájem tě stojí o <b>'+kc(dd)+'</b> ročně víc než prodej a zároveň držíš o '+kc(R.B.debt-R.A.debt)+' víc dluhu, takže jsi zranitelnější vůči zdražení úroků po fixaci i prázdnému bytu.');
    else op.push('Pronájem ti ročně přinese o <b>'+kc(dd)+'</b> víc než prodej, ale držíš o '+kc(R.B.debt-R.A.debt)+' víc dluhu. Počítáš tedy s tím, že byt bude obsazený a úroky po fixaci nepůjdou nahoru.');
  }
  if(netAfter<0)op.push('Nájem po nákladech '+kc(netBefore)+' měsíčně <b>nepokryje</b> splátku staré hypotéky '+kc(mort)+', doplácíš '+kc(-netAfter)+' měsíčně.');
  else op.push('Nájem po nákladech '+kc(netBefore)+' měsíčně pokryje splátku staré hypotéky '+kc(mort)+' a ještě zbyde '+kc(netAfter)+'.');
  if(bx.yearLeft>=0||true){
    var runway=(bx.savLeft>0)?bx.savLeft/(S.other+bx.housing+ann/12):0;
    op.push('Po koupi ti zůstane <b>'+kc(bx.savLeft)+'</b> úspor, což vystačí asi na <b>'+fmtIn(Math.round(runway*10)/10,1)+(runway>=5?' měsíců':' měsíce')+'</b> celých výdajů domácnosti. '+(runway<3?'To je málo, doporučuje se mít aspoň 3 až 6 měsíců.':runway<6?'To je v pořádku, i když nad rezervu bych neměl chodit.':'To je pohodlná rezerva.'));
  }
  t+='<div class="sumbox"><h2>Shrnutí: '+esc(P.name)+'</h2><div class="tiles">'+tiles+'</div>'+facts+
     '<div class="opinion"><h3>Můj názor</h3>'+op.map(function(x){return '<p>'+x+'</p>';}).join('')+
     '<p class="note">Je to pohled z čísel, která jsi zadal, a nejsem finanční poradce. Výsledek závisí na odhadech výdajů, úroku po refixaci a obsazenosti bytu. Přesné parametry ověř u banky.</p></div></div>';
  outEl.innerHTML=t;
  var et=document.getElementById('expTot'),at=document.getElementById('annTot');
  if(et)et.textContent=kc(B.expTotal())+' / měs';
  if(at)at.textContent=kc(B.annTotal())+' / rok';
}

/* vstupy */
function fieldHtml(id,label,unit,dec,scope){
  return '<label class="f"><span class="l">'+label+'</span><span class="in"><input data-s="'+scope+'" data-k="'+id+'" inputmode="decimal" autocomplete="off" data-d="'+(dec||0)+'"><span class="u">'+unit+'</span></span></label>';
}
function build(){
  var h='<fieldset class="prof"><legend>Nemovitost ke koupi</legend>'+
    '<label class="f col"><span class="l">Název profilu</span><span class="in"><input class="txt" id="pname" autocomplete="off" maxlength="60"></span></label>'+
    '<label class="f col"><span class="l">Poznámka (adresa, odkaz, na co si dát pozor)</span><span class="in"><input class="txt" id="pnote" autocomplete="off" maxlength="300"></span></label>'+
    B.PF.map(function(f){return fieldHtml(f[0],f[1],f[2],f[3],'p');}).join('')+
    '<div class="pbtns"><button type="button" id="dup">Duplikovat profil</button><button type="button" id="zero">Vynulovat čísla</button><button type="button" id="del" class="danger">Smazat profil</button></div></fieldset>';
  h+='<details class="common"><summary><span>Společné údaje</span></summary><div>';
  B.BG.forEach(function(g){
    h+='<fieldset><legend>'+g.t+'</legend>'+g.f.map(function(f){return fieldHtml(f[0],f[1],f[2],f[4],'b');}).join('')+'</fieldset>';
  });
  h+='</div></details>';
  h+='<details class="common"><summary><span>Měsíční výdaje domácnosti</span><span class="tot" id="expTot"></span></summary><div><fieldset><legend>Bez bydlení a bez spoření</legend>'+
    B.EXP.map(function(e){return fieldHtml(e[0],e[1],'Kč/měs',0,'e');}).join('')+
    '<p class="hint">Výchozí rozdělení je jen odhad, přepiš ho podle svého účtu. Součet vstupuje do výpočtu jako ostatní výdaje.</p>'+
    '<div class="pbtns"><button type="button" id="zeroE">Vynulovat měsíční výdaje</button></div></fieldset></div></details>';
  h+='<details class="common"><summary><span>Roční výdaje domácnosti</span><span class="tot" id="annTot"></span></summary><div><fieldset><legend>Jednou nebo dvakrát za rok</legend>'+
    B.ANN.map(function(e){return fieldHtml(e[0],e[1],'Kč/rok',0,'a');}).join('')+
    '<p class="hint">Částky jsou jen odhad, přepiš je. Roční výdaje se odečtou od toho, co zbývá za rok.</p>'+
    '<div class="pbtns"><button type="button" id="zeroA">Vynulovat roční výdaje</button></div></fieldset></div></details>';
  inEl.innerHTML=h;
}
function store(scope){return scope==='p'?B.cur().v:scope==='b'?st.base:scope==='e'?st.exp:st.ann;}
function fill(){
  var P=B.cur();
  document.getElementById('pname').value=P.name;
  document.getElementById('pnote').value=P.note;
  inEl.querySelectorAll('input[data-k]').forEach(function(el){
    el.value=fmtIn(store(el.dataset.s)[el.dataset.k],+el.dataset.d);
  });
}
inEl.addEventListener('input',function(e){
  var el=e.target,P=B.cur();
  if(el.id==='pname'){P.name=el.value.slice(0,60);B.save();B.fire();return;}
  if(el.id==='pnote'){P.note=el.value;B.save();return;}
  if(!el.dataset.k)return;
  store(el.dataset.s)[el.dataset.k]=parse(el.value);
  B.save();render();
});
inEl.addEventListener('focusin',function(e){if(e.target.tagName==='INPUT')e.target.select();});
inEl.addEventListener('focusout',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.k)return;
  el.value=fmtIn(store(el.dataset.s)[el.dataset.k],+el.dataset.d);
});
outEl.addEventListener('click',function(e){var r=e.target.closest('tr.pick');if(r)B.select(+r.dataset.id);});
outEl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var r=e.target.closest&&e.target.closest('tr.pick');if(r){e.preventDefault();B.select(+r.dataset.id);}}});

var tipEl=document.getElementById('tip'),tipOn=null;
function showTip(el){
  var d=TIPS[+el.dataset.t];if(!d)return;
  var h='<b>'+esc(d.t)+'</b>';
  d.r.forEach(function(r){h+='<div class="r'+(r[2]?' '+r[2]:'')+'"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>';});
  tipEl.innerHTML=h;tipEl.style.display='block';
  var b=el.getBoundingClientRect(),w=tipEl.offsetWidth,hh=tipEl.offsetHeight;
  var x=Math.min(Math.max(8,b.left),window.innerWidth-w-8),y=b.bottom+8;
  if(y+hh>window.innerHeight-8)y=Math.max(8,b.top-hh-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
  if(tipOn)tipOn.classList.remove('on');tipOn=el;el.classList.add('on');
}
function hideTip(){tipEl.style.display='none';if(tipOn){tipOn.classList.remove('on');tipOn=null;}}
document.addEventListener('pointerover',function(e){var w=e.target.closest&&e.target.closest('.why');if(w&&e.pointerType==='mouse')showTip(w);});
document.addEventListener('pointerout',function(e){var w=e.target.closest&&e.target.closest('.why');if(w&&e.pointerType==='mouse')hideTip();});
document.addEventListener('click',function(e){var w=e.target.closest&&e.target.closest('.why');if(w){if(tipOn===w)hideTip();else showTip(w);}else hideTip();});
document.addEventListener('focusin',function(e){var w=e.target.closest&&e.target.closest('.why');if(w)showTip(w);});
document.addEventListener('focusout',function(e){if(e.target.closest&&e.target.closest('.why'))hideTip();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hideTip();});
window.addEventListener('scroll',hideTip,true);

var stEl=document.getElementById('status');
function setStatus(m){stEl.textContent=m;}
var delTimer=null;
inEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='dup'){B.dupProfile();setStatus('Profil zduplikován. Přepiš v něm, co se liší.');}
  else if(b.id==='zero'){var v=B.cur().v;B.PIDS.forEach(function(k){v[k]=0;});B.save();fill();render();setStatus('Čísla profilu jsou vynulovaná.');}
  else if(b.id==='zeroE'){B.EXP.forEach(function(x){st.exp[x[0]]=0;});B.save();fill();render();setStatus('Měsíční výdaje jsou vynulované. Doplň vlastní.');}
  else if(b.id==='zeroA'){B.ANN.forEach(function(x){st.ann[x[0]]=0;});B.save();fill();render();setStatus('Roční výdaje jsou vynulované. Doplň vlastní.');}
  else if(b.id==='del'){
    if(st.profiles.length<2){setStatus('Poslední profil nejde smazat. Můžeš ho přepsat nebo vynulovat.');return;}
    if(b.dataset.arm){clearTimeout(delTimer);B.delProfile();setStatus('Profil smazán.');}
    else{b.dataset.arm='1';b.textContent='Opravdu smazat?';delTimer=setTimeout(function(){b.removeAttribute('data-arm');b.textContent='Smazat profil';},3000);}
  }
});

document.getElementById('demo').addEventListener('click',function(){B.resetAll();setStatus('Vrácena ukázka: tři profily, společné údaje i výdaje.');});
document.getElementById('share').addEventListener('click',function(){
  var url=B.shareUrl('index.html');
  var fb=function(){setStatus('Zkopíruj odkaz ručně: '+url);};
  try{navigator.clipboard.writeText(url).then(function(){setStatus('Odkaz se všemi profily, výdaji i společnými údaji je zkopírovaný. Kdo ho otevře, uvidí tato čísla.');},fb);}catch(e){fb();}
});
