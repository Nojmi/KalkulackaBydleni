<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kalkulačka většího bytu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span>
    <div>
      <h1>Kalkulačka většího bytu</h1>
      <p class="lead">Kolik nám po všech výdajích zbyde měsíčně a za rok?</p>
    </div>
  </div>
  <nav class="seg" aria-label="Stránky">
    <a class="seg-i on" href="index.html" aria-current="page">Základní kalkulačka</a>
    <a class="seg-i" href="komplexni.html">Komplexní kalkulačka <span class="beta">BETA</span></a>
    <a class="seg-i" href="uspory.html">Kam s úsporami <span class="beta">BETA</span></a>
  </nav>
</header>

<section class="profiles" aria-label="Profily nemovitostí">
  <div class="chips" id="chips" role="group" aria-label="Vyhlédnutý byt ke koupi"></div>
  <div class="pacts">
    <button class="ghost" type="button" id="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Přidat</button>
    <button class="ghost" type="button" id="dup"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Duplikovat</button>
    <button class="ghost" type="button" id="del"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Smazat</span></button>
  </div>
</section>
<p class="note" id="status" role="status"></p>

<section class="vgrid" id="cards" aria-label="Čtyři varianty pro vybraný profil"></section>

<div class="cols">
  <aside class="stack inputs" id="inputs" aria-label="Vstupy"></aside>
  <div class="stack res" id="out"></div>
</div>

</div>
<div id="tip" role="tooltip"></div>
<script src="shared.js"></script>
<script>
(function(){
var B=BYD,st=B.st,kc=B.kc,fmtIn=B.fmtIn,parse=B.parse,sgn=B.sgn,esc=B.esc;
var NAMES={D:'Dnes',A:'Prodat a koupit',B:'Koupit a pronajímat',C:'Zůstat'};
var DESC={D:'Zůstáváme, jak jsme.',C:'Zůstaneme ve starém bytě po zdražení hypotéky (refixaci).',A:'Starý byt prodáme a koupíme nový.',B:'Nový byt koupíme a starý pronajmeme.'};
var VC={D:'v0',C:'v1',A:'v2',B:'v3'};
var TIPS=[];
var ORDER=['D','C','A','B'];
var cardsEl=document.getElementById('cards'),outEl=document.getElementById('out'),inEl=document.getElementById('inputs'),chipsEl=document.getElementById('chips');
function kn(v){return kc(v).replace(/[\s  ]*Kč$/,'');}
function ng(v){return v<0?' neg':'';}
function mk(k){return '<span class="vh '+VC[k]+'"><span class="mk" aria-hidden="true"></span>'+NAMES[k]+'</span>';}
function sd(v){return (v>=0?'+':'−')+kc(Math.abs(v));}

function render(){
  var P=B.cur(),R=B.calc(P),S=R.s,ann=R.ann;
  TIPS=[];
  var Dd=R.D;
  function fp(r){return fmtIn(r,2)+' %';}
  function yrs(v){return fmtIn(Math.round(v*10)/10,1)+' let';}
  function T(title,rows){TIPS.push({t:title,r:rows});return '<span class="why" tabindex="0" role="button" aria-label="Ukázat výpočet" data-t="'+(TIPS.length-1)+'">i</span>';}
  function leftTip(x){return T('Zbývá měsíčně',[['Čistý příjem domácnosti',kc(S.income)],['− ostatní měsíční výdaje',kc(-S.other)],['− bydlení celkem',kc(-x.housing)],['Zbývá měsíčně',kc(x.left),'sum']]);}
  function yearTip(x){return T('Zbývá za rok',[['Příjem za rok (12 ×)',kc(S.income*12)],['− měsíční výdaje za rok',kc(-S.other*12)],['− bydlení za rok',kc(-x.housing*12)],['− roční výdaje',kc(-ann)],['Zbývá za rok',kc(x.yearLeft),'sum']]);}
  function houseTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Zálohy a energie nového bytu',x.serv],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns],['Zálohy, energie a garáž starého bytu',x.oldServ]].forEach(function(a){if(a[1])rows.push([a[0],kc(a[1])]);});
    if(x.rent)rows.push(['− příjem z pronájmu po nákladech',kc(-x.rent)]);
    rows.push(['Bydlení celkem',kc(x.housing),'sum']);return T('Bydlení celkem za měsíc',rows);
  }
  function houseYearTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Zálohy a energie nového bytu',x.serv],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns],['Zálohy, energie a garáž starého bytu',x.oldServ]].forEach(function(a){if(a[1])rows.push([a[0]+' (12 ×)',kc(a[1]*12)]);});
    if(x.rent)rows.push(['− příjem z pronájmu po nákladech (12 ×)',kc(-x.rent*12)]);
    rows.push(['Bydlení za rok',kc(x.housing*12),'sum']);return T('Bydlení celkem za rok',rows);
  }
  function hypTip(x){
    var rows=[];
    [['Splátka nové hypotéky',x.pay],['Pojištění nové hypotéky',x.ins],['Splátka staré hypotéky',x.oldPay],['Pojištění staré hypotéky',x.oldIns]].forEach(function(a){if(a[1])rows.push([a[0],kc(a[1])]);});
    rows.push(['Splátky všech hypoték',kc(x.pay+x.ins+x.oldPay+x.oldIns),'sum']);return T('Splátky všech hypoték vč. pojištění',rows);
  }
  function newPayTip(k,x){
    var rows=[['Kupní cena',kc(S.price)]];
    if(k==='A'){rows.push(['− z prodeje starého bytu (cena − náklady − zbývající hypotéka)',kc(-R.cash)]);rows.push(['− vlastní peníze',kc(-S.usedA)]);}
    else rows.push(['− vlastní peníze',kc(-S.usedB)]);
    rows.push(['Výše hypotéky',kc(x.loan),'sum']);
    if(S.reno)rows.push(['Rekonstrukci za '+kc(S.reno)+' platíš z úspor, není v hypotéce','','dim']);
    rows.push(['Úrok '+fp(k==='A'?S.rateA:S.rateB)+', splatnost '+S.term+' let','','dim']);
    rows.push(['Měsíční splátka',kc(x.pay),'sum']);
    return T('Splátka nové hypotéky',rows);
  }
  function oldPayTip(k,x){
    var rows;
    if(k==='D')rows=[['Zůstatek hypotéky dnes',kc(S.oldBal)],['Úrok dnes',fp(S.oldRate)],['Zbývající splatnost',yrs(S.oldYears)],['Měsíční splátka',kc(R.payNow),'sum']];
    else{var m=Math.max(0,Math.min(S.monthsFix,S.oldYears*12));rows=[['Zůstatek hypotéky dnes',kc(S.oldBal)],['Zůstatek po '+S.monthsFix+' měsících (konec fixace)',kc(R.balFix)],['Úrok po refixaci',fp(S.rateAfter)],['Zbývající splatnost po refixaci',yrs(S.oldYears-m/12)],['Měsíční splátka',kc(R.oldPay),'sum']];}
    return T('Splátka staré hypotéky',rows);
  }
  function rentTip(){
    var rM=S.rent*S.occ/12;
    return T('Příjem z pronájmu po nákladech',[['Nájem '+kc(S.rent)+' × '+S.occ+' z 12 měsíců',kc(rM)],['− poplatky SVJ, které platí vlastník',kc(-S.owner)],['− opravy a drobné náklady',kc(-S.repairs)],['− daň z nájmu',kc(-S.tax)],['Čistý příjem za měsíc',kc(rM-S.owner-S.repairs-S.tax),'sum']]);
  }
  var bestK=R.A.yearLeft>=R.B.yearLeft?'A':'B';
  var best=R.A.left===R.B.left?'':(R.A.left>R.B.left?'A':'B');

  /* chipy profilů */
  chipsEl.innerHTML=st.profiles.map(function(p){
    var on=p.id===P.id;
    return '<button class="chip'+(on?' sel':'')+'" type="button" data-profile="'+p.id+'" aria-pressed="'+on+'"><span class="cn">'+esc(p.name||'Bez názvu')+'</span><span class="cp num">'+kc(p.v.price)+'</span></button>';
  }).join('');
  var lg=document.getElementById('plegend');if(lg)lg.textContent='Profil nemovitosti – '+(P.name||'Bez názvu');

  /* karty variant */
  cardsEl.innerHTML=ORDER.map(function(k){
    var x=R[k];
    return '<article class="vcard '+VC[k]+'"><div class="vhead"><span class="mk" aria-hidden="true"></span><h3>'+NAMES[k]+'</h3></div>'+
      '<p class="vdesc">'+DESC[k]+'</p>'+
      '<div class="stats"><div class="st-m"><div class="lab">Zbývá měsíčně'+leftTip(x).replace('class="why"','class="why" style="margin:0 0 0 8px"')+'</div>'+
      '<div class="big'+ng(x.left)+'">'+kn(x.left)+'<small>Kč</small></div>'+
      '<span class="delta">'+(k==='D'?'Výchozí stav':sd(x.left-Dd.left)+' oproti dnešku')+'</span>'+(k===best?'<span class="delta good">z koupě vychází líp</span>':'')+'</div>'+
      '<div class="st-y"><div class="lab">Za rok po ročních výdajích'+yearTip(x).replace('class="why"','class="why" style="margin:0 0 0 8px"')+'</div>'+
      '<div class="mid'+ng(x.yearLeft)+'">'+kn(x.yearLeft)+'<small>Kč</small></div></div></div>'+
      '<div class="vrow"><span class="lab">Bydlení celkem</span><span class="val num">'+houseTip(x)+kc(x.housing)+'</span></div>'+
      '<div class="vrow"><span class="lab">Dluh celkem</span><span class="val num">'+kc(x.debt)+'</span></div></article>';
  }).join('');

  function tw(label,table,min){return '<div class="tw" role="region" aria-label="'+label+'" tabindex="0">'+table+'</div>';}
  function head(first){return '<thead><tr><th>'+(first||'')+'</th>'+ORDER.map(function(k){return '<th class="num">'+mk(k)+'</th>';}).join('')+'</tr></thead>';}
  function panel(cls,id,title,hint,body){return '<section class="panel '+cls+'" aria-labelledby="'+id+'"><div class="ph"><div><h2 id="'+id+'">'+title+'</h2>'+(hint?'<p class="hint">'+hint+'</p>':'')+'</div></div>'+body+'</section>';}

  /* porovnání profilů */
  var pr='<table style="min-width:560px"><thead><tr><th rowspan="2">Profil</th><th rowspan="2" class="num">Cena</th><th colspan="2" class="c">Zbývá měsíčně</th><th colspan="2" class="c">Zbývá za rok</th></tr><tr>'+
    '<th class="num">'+mk('A')+'</th><th class="num">'+mk('B')+'</th><th class="num">'+mk('A')+'</th><th class="num">'+mk('B')+'</th></tr></thead><tbody>';
  st.profiles.forEach(function(p){
    var r=B.calc(p),on=p.id===P.id;
    function c(v){return '<td class="num'+ng(v)+'">'+kc(v)+'</td>';}
    pr+='<tr data-id="'+p.id+'"'+(on?' class="sel"':'')+'><th scope="row"><button class="rowbtn" type="button" data-profile="'+p.id+'" aria-pressed="'+on+'"><i aria-hidden="true"></i>'+esc(p.name||'Bez názvu')+'</button></th><td class="num">'+kc(p.v.price)+'</td>'+c(r.A.left)+c(r.B.left)+c(r.A.yearLeft)+c(r.B.yearLeft)+'</tr>';
  });
  pr+='</tbody></table>';
  var sProf=panel('s-prof','h-prof','Porovnání profilů','Kliknutím vyberete profil, vše se přepočítá.',
    tw('Porovnání profilů',pr)+'<p class="note">Zbývá měsíčně je před ročními výdaji, zbývá za rok po nich. Dnes '+kc(R.D.left)+' měsíčně (za rok '+kc(R.D.yearLeft)+'), při setrvání po refixaci '+kc(R.C.left)+' (za rok '+kc(R.C.yearLeft)+').</p>');

  /* měsíční rozpočet */
  var t='<table>'+head('')+'<tbody>';
  function tr(l,fn,cls){t+='<tr'+(cls?' class="'+cls+'"':'')+'><th scope="row">'+l+'</th>'+ORDER.map(function(k){return '<td class="num">'+fn(R[k],k)+'</td>';}).join('')+'</tr>';}
  function sec(l){t+='<tr class="sec"><td colspan="5">'+l+'</td></tr>';}
  function dash(v){return v?kc(v):'–';}
  function sm(l,fn){t+='<tr class="sm"><th scope="row">'+l+'</th>'+ORDER.map(function(k){var v=fn(R[k],k);return '<td class="num">'+(v===null?'–':sd(v))+'</td>';}).join('')+'</tr>';}
  function hyp(x){return x.pay+x.ins+x.oldPay+x.oldIns;}
  function lc(x){return '<span class="'+ng(x.left).trim()+'">'+kc(x.left)+'</span>';}
  sec('Příjem a výdaje');
  tr('Čistý příjem domácnosti',function(){return kc(S.income);});
  tr('Ostatní výdaje (součet z rozpisu)',function(){return kc(-S.other);});
  sec('Nový byt');
  tr('Splátka nové hypotéky',function(x,k){return x.pay?newPayTip(k,x)+kc(x.pay):'–';});
  tr('Pojištění nové hypotéky',function(x){return dash(x.ins);});
  tr('Zálohy, energie a pojištění bytu',function(x){return dash(x.serv);});
  sec('Starý byt');
  tr('Splátka staré hypotéky',function(x,k){return x.oldPay?oldPayTip(k,x)+kc(x.oldPay):'–';});
  tr('Pojištění staré hypotéky',function(x){return dash(x.oldIns);});
  tr('Zálohy, energie a garáž',function(x){return dash(x.oldServ);});
  tr('Součet před odečtením pronájmu',function(x){return kc(x.housing+x.rent);});
  tr('Příjem z pronájmu po nákladech',function(x){return x.rent?rentTip()+kc(-x.rent):'–';});
  tr('Bydlení celkem',function(x){return houseTip(x)+kc(x.housing);},'strong');
  tr('Co zbývá měsíčně',function(x){return leftTip(x)+lc(x);},'hl');
  sec('Dluh a úspory');
  tr('Dluh celkem',function(x){return kc(x.debt);});
  tr('Úspory po koupi',function(x){return '<span class="'+(x.savLeft<0?'neg':'')+'">'+kc(x.savLeft)+'</span>';});
  sec('Hypotéky a rozdíly');
  tr('Splátky všech hypoték vč. pojištění',function(x){return hypTip(x)+kc(hyp(x));});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:hyp(x)-hyp(R.D);});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:hyp(x)-hyp(R.A);});
  tr('Dluh na všech hypotékách',function(x){return kc(x.debt);});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.debt-R.D.debt;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.debt-R.A.debt;});
  tr('Zbývá měsíčně',function(x){return leftTip(x)+lc(x);},'strong');
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.left-R.D.left;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.left-R.A.left;});
  t+='</tbody></table>';
  var sBud=panel('s-bud','h-bud','Měsíční rozpočet: '+esc(P.name),'Čtyři varianty vedle sebe, částky v Kč.',tw('Měsíční rozpočet čtyř variant',t));

  /* roční přehled */
  var yv=ORDER.map(function(k){return R[k].yearLeft;}),mx=Math.max.apply(null,yv.concat([0])),mn=Math.min.apply(null,yv.concat([0])),rg=(mx-mn)||1;
  var hr=ORDER.map(function(k){
    var v=R[k].yearLeft,l=(Math.min(v,0)-mn)/rg*100,w=Math.abs(v)/rg*100;
    return '<div class="hrow '+VC[k]+'"><span class="nm"><span class="mk" aria-hidden="true"></span>'+NAMES[k]+'</span><div class="track" aria-hidden="true"><div class="fill" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></div><div class="zl" style="left:calc('+((-mn)/rg*100).toFixed(2)+'% - 1px)"></div></div><span class="hv num'+ng(v)+'">'+kc(v)+'</span></div>';
  }).join('');
  t='<table>'+head('')+'<tbody>';
  sec('Za celý rok');
  tr('Čistý příjem domácnosti',function(){return kc(S.income*12);});
  tr('Měsíční výdaje domácnosti',function(){return kc(-S.other*12);});
  tr('Bydlení celkem',function(x){return houseYearTip(x)+kc(-x.housing*12);});
  tr('Roční výdaje (pojistky, dovolená, Vánoce, servis…)',function(){return kc(-ann);});
  tr('Zbývá za rok na investice a rezervu',function(x){return yearTip(x)+'<span class="'+ng(x.yearLeft).trim()+'">'+kc(x.yearLeft)+'</span>';},'hl');
  tr('Z toho v průměru měsíčně',function(x){return '<span class="'+ng(x.yearMonthly).trim()+'">'+kc(x.yearMonthly)+'</span>';});
  sm('rozdíl za rok oproti dnes',function(x,k){return k==='D'?null:x.yearLeft-R.D.yearLeft;});
  sm('rozdíl za rok oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.yearLeft-R.A.yearLeft;});
  t+='</tbody></table>';
  var sRok=panel('s-rok','h-rok','Roční přehled: '+esc(P.name),'Kolik za rok zbyde na investice a rezervu, po všech ročních výdajích.',
    hr+'<div class="sec-gap">'+tw('Roční přehled čtyř variant',t)+'</div><p class="note">Z toho, co zbývá, se dá spořit, investovat do akcií a tvořit polštář na nečekané věci. Rezerva na spotřebiče je už v ročních výdajích. Úspory po koupi: '+kc(R.A.savLeft)+' (prodat) a '+kc(R.B.savLeft)+' (pronajmout).</p>');

  /* rozpis výdajů */
  function blist(items,scale){
    var mxv=1;items.forEach(function(a){mxv=Math.max(mxv,a[1]);});
    return items.map(function(a){return '<div class="bl"><span class="t">'+a[0]+'</span><span class="num">'+kc(a[1])+'</span><span class="mini" aria-hidden="true"><b style="width:'+Math.max(2,Math.round(a[1]/mxv*100))+'%"></b></span></div>';}).join('');
  }
  var mi=[],ai=[];
  B.EXP.forEach(function(e){var v=st.exp[e[0]];if(v)mi.push([e[1],v]);});
  B.ANN.forEach(function(e){var v=st.ann[e[0]];if(v)ai.push([e[1],v]);});
  var sVyd=panel('s-vyd','h-vyd','Výdaje domácnosti mimo bydlení','Rozpis položek z rozbalovacích sekcí.',
    '<div class="split"><div><div class="subh"><h3>Měsíčně</h3><span class="num">'+kc(S.other)+'</span></div>'+blist(mi)+'</div>'+
    '<div><div class="subh"><h3>Ročně</h3><span class="num">'+kc(ann)+'</span></div>'+blist(ai)+'</div></div>'+
    '<p class="note">Výdaje domácnosti celkem (bez bydlení): '+kc(S.other+ann/12)+' měsíčně, '+kc(S.other*12+ann)+' ročně. Roční výdaje se do měsíčních rozpočtů počítají rozpočítané na dvanáct měsíců. Spoření a investice tu nejsou, jsou součástí toho, co zbývá.</p>');

  /* pronájem */
  var rM=S.rent*S.occ/12,rY=S.rent*S.occ/12*12,opM=S.owner+S.repairs+S.tax,netBefore=rM-opM,mort=R.oldPay+S.oldInsAfter,netAfter=netBefore-mort;
  var base=S.rent>0?S.rent:1,cum=S.rent;
  function wf(l,amt,isTot,after){
    var left,width;
    if(isTot){left=0;width=Math.max(0,after)/base*100;}
    else{cum-=amt;left=Math.max(0,cum)/base*100;width=amt/base*100;}
    return '<div class="wf'+(isTot?' tot':'')+'"><span class="t">'+l+'</span><div class="track" aria-hidden="true"><div class="fill" style="left:'+left.toFixed(2)+'%;width:'+Math.min(100,width).toFixed(2)+'%"></div></div><span class="num'+(isTot?'':' neg')+'">'+(isTot?kc(after):kc(-amt))+'</span></div>';
  }
  var tenSvj=Math.max(0,S.svjTotal-S.owner);
  var w='<div class="wf tot"><span class="t">Nájem za měsíc</span><div class="track" aria-hidden="true"><div class="fill" style="left:0%;width:100%"></div></div><span class="num">'+kc(S.rent)+'</span></div>'+
    wf('Neobsazenost (obsazenost '+S.occ+' měsíců z 12)',S.rent-rM,false)+wf('Poplatky SVJ, které platí vlastník',S.owner,false)+wf('Opravy a drobné náklady',S.repairs,false)+wf('Daň z nájmu (odhad)',S.tax,false)+
    wf('Příjem z pronájmu po nákladech',0,true,netBefore);
  function r2(l,v,cls){var c=cls?(v<0?'neg':''):'';return '<tr'+(cls?' class="'+cls+'"':'')+'><th scope="row">'+l+'</th><td class="num '+c+'">'+kc(v)+'</td><td class="num '+c+'">'+kc(v*12)+'</td></tr>';}
  var tb='<table class="nomin"><thead><tr><th>Hypotéka starého bytu po refixaci</th><th class="num">Měsíčně</th><th class="num">Ročně</th></tr></thead><tbody>'+
    r2('Splátka hypotéky',-R.oldPay)+r2('Pojištění hypotéky',-S.oldInsAfter)+r2('Příjem z pronájmu po nákladech',netBefore)+
    r2(netAfter>=0?'Pronájem ti měsíčně přispívá':'Na pronájem měsíčně doplácíš',netAfter,'hl')+'</tbody></table>';
  var sNaj=panel('s-naj','h-naj','Pronájem starého bytu','Od měsíčního nájmu k tomu, co skutečně zbyde.',
    w+'<div class="sec-gap">'+tw('Pronájem a hypotéka starého bytu',tb)+'</div><p class="note">Zálohy SVJ celkem '+kc(S.svjTotal)+' měsíčně: vlastník platí '+kc(S.owner)+' (je v nákladech), nájemník nad rámec nájmu '+kc(tenSvj)+' (tvým rozpočtem neprochází). Zálohy a energie ve starém bytě platí nájemník. Pronájem je stejný pro všechny nemovitosti.</p>');

  /* graf zbývá měsíčně */
  var lv=ORDER.map(function(k){return R[k].left;}),lmx=Math.max.apply(null,lv.concat([0])),lmn=Math.min.apply(null,lv.concat([0])),lrg=(lmx-lmn)||1;
  var cols=ORDER.map(function(k,i){
    var v=lv[i],b=(Math.min(v,0)-lmn)/lrg*100,hh=Math.abs(v)/lrg*100;
    var pos=v>=0?'bottom:calc('+(b+hh).toFixed(2)+'% + 6px)':'bottom:calc('+b.toFixed(2)+'% - 24px)';
    return '<div class="vcol '+VC[k]+'"><div class="vbar" style="bottom:'+b.toFixed(2)+'%;height:'+hh.toFixed(2)+'%"></div><div class="vlab'+ng(v)+'" style="'+pos+'">'+kc(v)+'</div></div>';
  }).join('');
  var sGr=panel('s-gr','h-gr','Kolik zbývá měsíčně','Čtyři varianty pro vybraný profil, v Kč.',
    '<div class="vplot'+(lmn<0?' negs':'')+'" role="img" aria-label="Sloupcový graf: kolik zbývá měsíčně v každé variantě"><div class="vzero" style="bottom:'+((-lmn)/lrg*100).toFixed(2)+'%"></div><div class="vcols">'+cols+'</div></div>'+
    '<div class="vcats">'+ORDER.map(function(k){return '<div class="vcat '+VC[k]+'"><span class="mk" aria-hidden="true"></span>'+NAMES[k]+'</div>';}).join('')+'</div>');

  /* shrnutí */
  var bx=R[bestK];
  function pctOf(x){return Dd.yearLeft>0?Math.round(x.yearLeft/Dd.yearLeft*100):null;}
  var tiles=ORDER.map(function(k){
    var x=R[k];
    return '<div class="tile '+VC[k]+'">'+mk(k)+'<div class="lab">Měsíčně</div><div class="mid'+ng(x.left)+'">'+kn(x.left)+'<small>Kč</small></div><div class="lab">Za rok</div><div class="mid'+ng(x.yearLeft)+'">'+kn(x.yearLeft)+'<small>Kč</small></div>'+
      '<div class="lab">'+(k==='D'?'výchozí stav':sd(x.yearLeft-Dd.yearLeft)+' ročně oproti dnes')+'</div></div>';
  }).join('');
  var facts='<ul class="facts">'+
    '<li>Splátka staré hypotéky po refixaci vzroste z <b>'+kc(R.payNow)+'</b> na <b>'+kc(R.oldPay)+'</b> měsíčně.</li>'+
    '<li>Z prodeje starého bytu zbude po doplacení hypotéky a nákladech <b>'+kc(R.cash)+'</b>. Nový byt stojí <b>'+kc(S.price)+'</b>, rekonstrukci za <b>'+kc(S.reno)+'</b> zaplatíš z úspor.</li>'+
    '<li>Dnes ti po měsíčních výdajích zbývá <b>'+kc(Dd.left)+'</b>, po ročních výdajích <b>'+kc(Dd.yearLeft)+'</b> za rok.</li>'+
    '<li>Při pronájmu je dluh o <b>'+kc(Math.abs(R.B.debt-R.A.debt))+'</b> '+(R.B.debt>=R.A.debt?'vyšší':'nižší')+' než při prodeji a zbývá o <b>'+kc(Math.abs(R.B.yearLeft-R.A.yearLeft))+'</b> ročně '+(R.B.yearLeft>=R.A.yearLeft?'víc':'méně')+'.</li></ul>';
  /* názor podle čísel */
  var op=[];
  var nm=bestK==='A'?'prodej starého bytu':'pronájem starého bytu';
  if(bx.yearLeft<0){
    op.push('Podle těchto čísel <b>nevychází ani jedna varianta</b>: po všech výdajích jsi i v nejlepším případě v mínusu <b>'+kc(-bx.yearLeft)+'</b> ročně. Je potřeba levnější byt, větší vlastní vklad nebo nižší výdaje.');
  }else{
    var pc=pctOf(bx);
    op.push('Podle čísel vychází líp <b>'+nm+'</b>. Po všech výdajích ti zbude <b>'+kc(bx.yearLeft)+'</b> ročně ('+kc(bx.yearMonthly)+' měsíčně)'+(pc!==null?', tedy asi <b>'+pc+' %</b> dnešního přebytku':'')+'. Dnes ti zbývá '+kc(Dd.yearLeft)+', takže životní standard se posune o <b>'+kc(Math.abs(bx.yearLeft-Dd.yearLeft))+'</b> ročně '+(bx.yearLeft>=Dd.yearLeft?'nahoru':'dolů')+'.');
    if(bx.yearMonthly<10000)op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně je <b>tenký</b>. Jeden nečekaný větší výdaj (auto, oprava, výpadek příjmu) ho smaže, takže na investice nezbyde nic.');
    else if(bx.yearMonthly<30000)op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně vystačí na rezervu a drobné investice, ale na větší spoření už moc ne.');
    else op.push('Přebytek '+kc(bx.yearMonthly)+' měsíčně je solidní, vedle rezervy zůstane i na pravidelné investice.');
  }
  if(R.B.yearLeft!==R.A.yearLeft){
    var dd=Math.abs(R.B.yearLeft-R.A.yearLeft);
    if(bestK==='A')op.push('Pronájem tě stojí o <b>'+kc(dd)+'</b> ročně víc než prodej a zároveň držíš o '+kc(R.B.debt-R.A.debt)+' víc dluhu, takže jsi zranitelnější vůči zdražení úroků po fixaci i prázdnému bytu.');
    else op.push('Pronájem ti ročně přinese o <b>'+kc(dd)+'</b> víc než prodej, ale držíš o '+kc(R.B.debt-R.A.debt)+' víc dluhu. Počítáš tedy s tím, že byt bude obsazený a úroky po fixaci nepůjdou nahoru.');
  }
  if(netAfter<0)op.push('Nájem po nákladech '+kc(netBefore)+' měsíčně <b>nepokryje</b> splátku staré hypotéky '+kc(mort)+', doplácíš '+kc(-netAfter)+' měsíčně.');
  else op.push('Nájem po nákladech '+kc(netBefore)+' měsíčně pokryje splátku staré hypotéky '+kc(mort)+' a ještě zbyde '+kc(netAfter)+'.');
  if(bx.yearLeft>=0||true){
    var runway=(bx.savLeft>0)?bx.savLeft/(S.other+bx.housing+ann/12):0;
    op.push('Po koupi ti zůstane <b>'+kc(bx.savLeft)+'</b> úspor, což vystačí asi na <b>'+fmtIn(Math.round(runway*10)/10,1)+(runway>=5?' měsíců':' měsíce')+'</b> celých výdajů domácnosti. '+(runway<3?'To je málo, doporučuje se mít aspoň 3 až 6 měsíců.':runway<6?'To je v pořádku, i když nad rezervu bych neměl chodit.':'To je pohodlná rezerva.'));
  }
  var sSh=panel('s-sh','h-sh','Shrnutí: '+esc(P.name),'',
    '<div class="tiles">'+tiles+'</div>'+facts+
    '<div class="verdict"><h3>Můj názor</h3>'+op.map(function(x){return '<p>'+x+'</p>';}).join('')+
    '<p class="note">Je to pohled z čísel, která jsi zadal, a nejsem finanční poradce. Výsledek závisí na odhadech výdajů, úroku po refixaci a obsazenosti bytu. Přesné parametry ověř u banky.</p></div>');

  outEl.innerHTML='<div class="resA">'+sProf+sBud+sVyd+sNaj+'</div><div class="resB">'+sRok+sGr+sSh+'</div>';
  var et=document.getElementById('expTot'),at=document.getElementById('annTot');
  if(et)et.textContent=kc(B.expTotal());
  if(at)at.textContent=kc(B.annTotal());
}

/* vstupy */
function fieldHtml(id,label,unit,dec,scope){
  var fid='f-'+scope+'-'+id;
  return '<div class="field"><label for="'+fid+'">'+label+'</label><div class="inp"><input id="'+fid+'" data-s="'+scope+'" data-k="'+id+'" type="text" inputmode="decimal" autocomplete="off" data-d="'+(dec||0)+'"><span class="u">'+unit+'</span></div></div>';
}
function renoHtml(f){
  return '<div class="field"><label for="f-p-reno">'+f[1]+'</label><div class="inp"><input id="f-p-reno" data-s="p" data-k="reno" data-d="0" type="text" readonly tabindex="-1" aria-readonly="true"><span class="u">Kč</span></div></div>'+
    '<details class="sub" open><summary>Rozpis rekonstrukce</summary>'+B.RENO.map(function(r){return fieldHtml(r[0],r[1],'Kč',0,'p');}).join('')+
    '<p class="note" style="margin:6px 0 0">Součet se platí z úspor a nezvyšuje úvěr.</p></details>';
}
function build(){
  var h='<div class="panel inp-panel"><fieldset class="grp"><legend id="plegend">Profil nemovitosti</legend>'+
    '<div class="field col"><label for="pname">Název profilu</label><div class="inp"><input class="txt" id="pname" type="text" autocomplete="off" maxlength="60"></div></div>'+
    '<div class="field col"><label for="pnote">Poznámka (adresa, odkaz, na co si dát pozor)</label><div class="inp"><input class="txt" id="pnote" type="text" autocomplete="off" maxlength="300"></div></div>'+
    B.PF.map(function(f){return f[0]==='reno'?renoHtml(f):fieldHtml(f[0],f[1],f[2],f[3],'p');}).join('')+
    '<button class="ghost sm" type="button" id="zero" style="margin-top:10px">Vynulovat čísla profilu</button></fieldset>';
  B.BG.forEach(function(g){
    h+='<fieldset class="grp"><legend>'+g.t+'</legend>'+g.f.map(function(f){return fieldHtml(f[0],f[1],f[2],f[4],'b');}).join('')+'</fieldset>';
  });
  h+='</div>';
  h+='<details class="acc"><summary><span class="at">Měsíční výdaje domácnosti</span><span class="sum num" id="expTot"></span></summary><div class="accbody">'+
    B.EXP.map(function(e){return fieldHtml(e[0],e[1],'Kč/měs',0,'e');}).join('')+
    '<p class="note" style="margin-top:10px">Bez bydlení a bez spoření. Výchozí rozdělení je jen odhad, přepiš ho podle svého účtu.</p>'+
    '<button class="ghost sm" type="button" id="zeroE">Vynulovat</button></div></details>';
  h+='<details class="acc"><summary><span class="at">Roční výdaje domácnosti</span><span class="sum num" id="annTot"></span></summary><div class="accbody">'+
    B.ANN.map(function(e){return fieldHtml(e[0],e[1],'Kč/rok',0,'a');}).join('')+
    '<p class="note" style="margin-top:10px">Jednou nebo dvakrát za rok. Částky jsou jen odhad, přepiš je. Odečtou se od toho, co zbývá za rok.</p>'+
    '<button class="ghost sm" type="button" id="zeroA">Vynulovat</button></div></details>';
  h+='<div class="btns"><button class="solid" type="button" id="share"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Zkopírovat odkaz s mými čísly</button><button class="ghost" type="button" id="demo">Vrátit ukázku</button></div>';
  inEl.innerHTML=h;
}
function store(scope){return scope==='p'?B.cur().v:scope==='b'?st.base:scope==='e'?st.exp:st.ann;}
function fill(){
  var P=B.cur();
  document.getElementById('pname').value=P.name;
  document.getElementById('pnote').value=P.note;
  inEl.querySelectorAll('input[data-k]').forEach(function(el){
    el.value=fmtIn(store(el.dataset.s)[el.dataset.k],+el.dataset.d);
  });
}
inEl.addEventListener('input',function(e){
  var el=e.target,P=B.cur();
  if(el.id==='pname'){P.name=el.value.slice(0,60);B.save();B.fire();return;}
  if(el.id==='pnote'){P.note=el.value;B.save();return;}
  if(!el.dataset.k)return;
  store(el.dataset.s)[el.dataset.k]=parse(el.value);
  if(el.dataset.s==='p'&&B.RIDS.indexOf(el.dataset.k)>=0){var pv=B.cur().v;pv.reno=B.renoTotal(pv);var tt=document.getElementById('f-p-reno');if(tt)tt.value=fmtIn(pv.reno,0);}
  B.save();render();
});
inEl.addEventListener('focusin',function(e){if(e.target.tagName==='INPUT')e.target.select();});
inEl.addEventListener('focusout',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.k)return;
  el.value=fmtIn(store(el.dataset.s)[el.dataset.k],+el.dataset.d);
});
document.addEventListener('click',function(e){
  var r=e.target.closest&&e.target.closest('[data-profile]');if(r){B.select(+r.dataset.profile);return;}
  var tr=e.target.closest&&e.target.closest('tr[data-id]');if(tr&&!e.target.closest('.why'))B.select(+tr.dataset.id);
});

var tipEl=document.getElementById('tip'),tipOn=null;
function showTip(el){
  var d=TIPS[+el.dataset.t];if(!d)return;
  var h='<b>'+esc(d.t)+'</b>';
  d.r.forEach(function(r){h+='<div class="r'+(r[2]?' '+r[2]:'')+'"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>';});
  tipEl.innerHTML=h;tipEl.style.display='block';
  var b=el.getBoundingClientRect(),w=tipEl.offsetWidth,hh=tipEl.offsetHeight;
  var x=Math.min(Math.max(8,b.left),window.innerWidth-w-8),y=b.bottom+8;
  if(y+hh>window.innerHeight-8)y=Math.max(8,b.top-hh-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';
  if(tipOn)tipOn.classList.remove('on');tipOn=el;el.classList.add('on');
}
function hideTip(){tipEl.style.display='none';if(tipOn){tipOn.classList.remove('on');tipOn=null;}}
document.addEventListener('pointerover',function(e){var w=e.target.closest&&e.target.closest('.why');if(w&&e.pointerType==='mouse')showTip(w);});
document.addEventListener('pointerout',function(e){var w=e.target.closest&&e.target.closest('.why');if(w&&e.pointerType==='mouse')hideTip();});
document.addEventListener('click',function(e){var w=e.target.closest&&e.target.closest('.why');if(w){if(tipOn===w)hideTip();else showTip(w);}else hideTip();});
document.addEventListener('focusin',function(e){var w=e.target.closest&&e.target.closest('.why');if(w)showTip(w);});
document.addEventListener('focusout',function(e){if(e.target.closest&&e.target.closest('.why'))hideTip();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hideTip();if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('why')){e.preventDefault();showTip(e.target);}});
window.addEventListener('scroll',hideTip,true);

var stEl=document.getElementById('status');
function setStatus(m){stEl.textContent=m;}
var delTimer=null,delBtn=document.getElementById('del'),delLab=delBtn.querySelector('span');
document.getElementById('add').addEventListener('click',function(){B.addProfile();setStatus('Přidán prázdný profil. Vyplň cenu, zálohy a pojištění. Úrok, splatnost a vlastní peníze jsou převzaté z předchozího.');});
document.getElementById('dup').addEventListener('click',function(){B.dupProfile();setStatus('Profil zduplikován. Přepiš v něm, co se liší.');});
delBtn.addEventListener('click',function(){
  if(st.profiles.length<2){setStatus('Poslední profil nejde smazat. Můžeš ho přepsat nebo vynulovat.');return;}
  if(delBtn.dataset.arm){clearTimeout(delTimer);delBtn.removeAttribute('data-arm');delLab.textContent='Smazat';B.delProfile();setStatus('Profil smazán.');}
  else{delBtn.dataset.arm='1';delLab.textContent='Opravdu smazat?';delTimer=setTimeout(function(){delBtn.removeAttribute('data-arm');delLab.textContent='Smazat';},3000);}
});
inEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='zero'){var v=B.cur().v;B.PIDS.forEach(function(k){v[k]=0;});B.save();fill();render();setStatus('Čísla profilu jsou vynulovaná.');}
  else if(b.id==='zeroE'){B.EXP.forEach(function(x){st.exp[x[0]]=0;});B.save();fill();render();setStatus('Měsíční výdaje jsou vynulované. Doplň vlastní.');}
  else if(b.id==='zeroA'){B.ANN.forEach(function(x){st.ann[x[0]]=0;});B.save();fill();render();setStatus('Roční výdaje jsou vynulované. Doplň vlastní.');}
  else if(b.id==='demo'){B.resetAll();setStatus('Vrácena ukázka: tři profily, společné údaje i výdaje.');}
  else if(b.id==='share'){
    var url=B.shareUrl('index.html');
    var fb=function(){setStatus('Zkopíruj odkaz ručně: '+url);};
    try{navigator.clipboard.writeText(url).then(function(){setStatus('Odkaz se všemi profily, výdaji i společnými údaji je zkopírovaný. Kdo ho otevře, uvidí tato čísla.');},fb);}catch(err){fb();}
  }
});

build();
B.onChange(function(){var ae=document.activeElement;if(!(ae&&ae.id==='pname'))fill();render();});
fill();render();
setStatus('Ukázkové údaje. Výdaje domácnosti a roční výdaje jsou jen odhad, přepiš je podle svého účtu.');
})();
</script>
</body></html>
