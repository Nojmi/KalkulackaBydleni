<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profily nemovitostí ke koupi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Profily nemovitostí: společné údaje (domácnost, starý byt, pronájem) + samostatný profil každého bytu ke koupi. */
:root{
  --bg:#cfd5d1;--surface:#e3e7e4;--field:#d2d8d4;--ink:#141a18;--muted:#46524d;--line:#b3bcb7;
  --a:#0f766e;--b:#b45309;--c:#4f46e5;--d:#64748b;--good:#15803d;--bad:#b91c1c;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f0e;--surface:#111917;--field:#1a2421;--ink:#e8eeec;--muted:#93a29c;--line:#26312e;
  --a:#2dd4bf;--b:#fbbf24;--c:#a5b4fc;--d:#94a3b8;--good:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f0e;--surface:#111917;--field:#1a2421;--ink:#e8eeec;--muted:#93a29c;--line:#26312e;
  --a:#2dd4bf;--b:#fbbf24;--c:#a5b4fc;--d:#94a3b8;--good:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-end}
h1{font-family:var(--cond);font-weight:600;font-size:28px;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);max-width:64ch}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);font-size:13px;text-decoration:none}
.back:hover{color:var(--ink);text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button:hover{background:var(--field)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.profiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--k);border-radius:8px;padding:14px 16px;min-width:0}
.card.A{--k:var(--a)}.card.B{--k:var(--b)}.card.C{--k:var(--c)}.card.D{--k:var(--d)}
.card h3{margin:0;font-family:var(--cond);font-size:17px;font-weight:600}
.card .d{color:var(--muted);font-size:13px;margin-bottom:8px}
.card .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@supports (grid-template-rows:subgrid){.card{display:grid;grid-template-rows:subgrid;grid-row:span 5;row-gap:0;align-content:start}}
.big{font-size:28px;font-weight:700;line-height:1.15}
.small{font-size:13px;color:var(--muted);margin-top:4px}
.main{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:0;padding:6px 14px 10px;min-width:0}
fieldset.prof{border-color:var(--ink);border-width:2px}
legend{font-family:var(--cond);font-weight:600;font-size:16px;padding:0 6px}
details.common{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
details.common>summary{cursor:pointer;font-family:var(--cond);font-weight:600;font-size:16px;padding:10px 14px}
details.common>div{display:flex;flex-direction:column;gap:12px;padding:0 10px 12px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f .l{font-size:13.5px;line-height:1.3;min-width:0}
.f .in{display:flex;align-items:center;background:var(--field);border-radius:6px;flex:0 0 160px}
.f input{width:100%;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:500;text-align:right;padding:8px 6px 8px 10px}
.f input.txt{text-align:left}
.f.col{flex-direction:column;align-items:stretch}
.f.col .in{flex:1 1 auto}
.f .u{color:var(--muted);font-size:12px;padding-right:9px;white-space:nowrap}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 2px}
.pbtns button{padding:7px 12px;font-size:13px}
h2{font-family:var(--cond);font-weight:600;font-size:19px;margin:0 0 8px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-family:var(--cond);font-weight:600;font-size:14px;border-bottom:2px solid var(--line)}
thead th i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--k);margin-right:6px}
tr.sec td{background:var(--field);font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:5px}
tr.sm td{font-size:12px;color:var(--muted);padding-block:4px;border-bottom-color:transparent}
tr.sm td:first-child{padding-left:24px}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--field)}
tr.pick.on td{background:var(--field);font-weight:700}
tr:last-child td{border-bottom:0}
.pos{color:var(--good)}.neg{color:var(--bad)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
svg{display:block;width:100%;height:auto}
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.verdict p{margin:0 0 6px}.verdict p:last-child{margin:0}
.note{color:var(--muted);font-size:13px;margin:0}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .f .in{flex-basis:140px}
}
</style></head><body>

<div class="wrap">
  <header>
    <div>
      <a class="back" href="index.html">← Zpět na jednoduchou kalkulačku</a>
      <h1>Profily nemovitostí ke koupi</h1>
      <p class="sub">Každý vyhlídnutý byt má vlastní profil. Přepínáš mezi nimi, přidáváš další a vše se přepočítá. Údaje o domácnosti, starém bytě a pronájmu jsou společné pro všechny profily.</p>
    </div>
    <div class="btns">
      <button id="demo" type="button">Vrátit ukázku</button>
      <button id="share" type="button">Zkopírovat odkaz s mými čísly</button>
    </div>
  </header>

  <div class="profiles" id="chips" role="group" aria-label="Profily nemovitostí"></div>
  <p class="note" id="status"></p>
  <section class="cards" id="cards" aria-label="Výsledek vybraného profilu"></section>

  <div class="main">
    <div class="panel" id="inputs"></div>
    <div class="panel" id="out"></div>
  </div>
</div>

<script>
(function(){
/* Pole profilu nemovitosti ke koupi */
var PF=[
 ['price','Kupní cena','Kč'],
 ['reno','Kuchyň, nábytek, stěhování, právník','Kč'],
 ['newServ','Zálohy, energie a pojištění bytu','Kč/měs'],
 ['usedA','Vlastní peníze do koupě, když starý byt prodáte','Kč'],
 ['usedB','Vlastní peníze do koupě, když starý byt necháte','Kč'],
 ['rateA','Úrok, když starý byt prodáte','% p. a.',2],
 ['rateB','Úrok, když starý byt necháte','% p. a.',2],
 ['term','Splatnost','let'],
 ['insA','Pojištění hypotéky, když starý byt prodáte','Kč/měs'],
 ['insB','Pojištění hypotéky, když starý byt necháte','Kč/měs']
];
/* Společné údaje */
var BG=[
 {t:'Domácnost',f:[
  ['income','Čistý příjem domácnosti za měsíc (průměr)','Kč/měs',180000],
  ['other','Ostatní měsíční výdaje (jídlo, auto, děti, spoření)','Kč/měs',40000]
 ]},
 {t:'Starý byt dnes',f:[
  ['oldBal','Zbývá doplatit hypotéku dnes','Kč',3000000],
  ['oldRate','Úrok staré hypotéky dnes','% p. a.',1.9,2],
  ['oldYears','Zbývající splatnost staré hypotéky dnes','let',24],
  ['oldIns','Pojištění hypotéky dnes','Kč/měs',1100],
  ['oldServ','Zálohy, energie a garáž dnes, když v něm bydlíte','Kč/měs',13000]
 ]},
 {t:'Starý byt po refixaci',f:[
  ['monthsFix','Za kolik měsíců končí fixace','měsíců',12],
  ['rateAfter','Úrok staré hypotéky po refixaci (odhad)','% p. a.',4.79,2],
  ['oldInsAfter','Pojištění hypotéky po refixaci','Kč/měs',1100],
  ['oldServAfter','Zálohy, energie a garáž po refixaci, když v něm bydlíte','Kč/měs',13000],
  ['oldValue','Cena, za kterou ho prodáte','Kč',8200000],
  ['sellCost','Náklady prodeje (provize, právník)','Kč',0]
 ]},
 {t:'Úspory',f:[
  ['savings','Úspory a investice celkem','Kč',2000000]
 ]},
 {t:'Pronájem starého bytu',f:[
  ['rent','Nájem za měsíc','Kč/měs',28000],
  ['occ','Kolik měsíců v roce je byt pronajatý','z 12',12],
  ['svjTotal','Předpis záloh SVJ za byt celkem','Kč/měs',7292],
  ['owner','z toho platí vlastník (fond oprav, správa, pojištění domu)','Kč/měs',3984],
  ['repairs','Opravy a drobné náklady','Kč/měs',1000],
  ['tax','Daň z nájmu (odhad)','Kč/měs',3452]
 ]}
];
var BDEF={},BIDS=[],PIDS=PF.map(function(f){return f[0];});
BG.forEach(function(g){g.f.forEach(function(f){BDEF[f[0]]=f[3];BIDS.push(f[0]);});});

/* Ukázkové profily: Silurská a Sazovická jsou odhady, přepiš je podle nabídky banky */
function seed(){return [
 {id:1,name:'Silurská 4+kk, 94 m²',note:'Ukázka',v:{price:13998700,reno:350000,newServ:17000,usedA:1000000,usedB:1000000,rateA:5,rateB:5.29,term:30,insA:5000,insB:6500}},
 {id:2,name:'Sazovická, Zličín 4+kk, 116 m²',note:'Terasa, 2 garážová stání. Zálohy a pojištění jsou odhad.',v:{price:17950000,reno:350000,newServ:11650,usedA:1000000,usedB:1000000,rateA:4.79,rateB:4.79,term:30,insA:6900,insB:9976}},
 {id:3,name:'Kutrovická, Řepy 4+kk, 141 m²',note:'3. NP z 4, rok 2015, 2 garážová stání a sklep v ceně, cena vč. provize a právního servisu. Pojištění podle kalkulačky Moneta (6 336 Kč při hypotéce 11 mil.), zálohy jsou odhad.',v:{price:16950000,reno:350000,newServ:15000,usedA:1000000,usedB:1000000,rateA:4.79,rateB:4.79,term:30,insA:6336,insB:9386}}
];}

var KEY='kalkulacka-profily-v1',OLDKEY='kalkulacka-vetsiho-bytu-v1';
var base=JSON.parse(JSON.stringify(BDEF)),profiles=seed(),sel=1,nextId=4;

function num(x){return typeof x==='number'&&isFinite(x);}
function adopt(o){
  if(!o||typeof o!=='object')return false;
  if(o.base)BIDS.forEach(function(k){if(num(o.base[k]))base[k]=o.base[k];});
  if(Array.isArray(o.profiles)&&o.profiles.length){
    var list=[];
    o.profiles.slice(0,30).forEach(function(p,i){
      if(!p||typeof p!=='object')return;
      var v={};PIDS.forEach(function(k){v[k]=p.v&&num(p.v[k])?p.v[k]:0;});
      list.push({id:num(p.id)?p.id:i+1,name:String(p.name||'Profil').slice(0,60),note:String(p.note||'').slice(0,200),v:v});
    });
    if(list.length){profiles=list;nextId=Math.max.apply(null,list.map(function(p){return p.id;}))+1;sel=num(o.sel)&&list.some(function(p){return p.id===o.sel;})?o.sel:list[0].id;}
  }
  return true;
}
/* společné údaje převezmu z jednoduché kalkulačky, pokud je tam uložené */
try{var old=localStorage.getItem(OLDKEY);if(old){var oo=JSON.parse(old);BIDS.forEach(function(k){if(num(oo[k]))base[k]=oo[k];});}}catch(e){}
try{var raw=localStorage.getItem(KEY);if(raw)adopt(JSON.parse(raw));}catch(e){}
try{var hm=/^#d=(.+)$/.exec(location.hash);if(hm)adopt(JSON.parse(decodeURIComponent(escape(atob(hm[1])))));}catch(e){}
/* odkaz #p=... přidá jeden profil k existujícím, nic nepřepisuje */
try{var pm=/^#p=(.+)$/.exec(location.hash);if(pm){var po=JSON.parse(decodeURIComponent(escape(atob(pm[1]))));
  var pv={};PIDS.forEach(function(k){pv[k]=num(po.v&&po.v[k])?po.v[k]:0;});
  profiles.push({id:nextId,name:String(po.name||'Profil').slice(0,60),note:String(po.note||'').slice(0,200),v:pv});sel=nextId++;
  history.replaceState(null,'',location.pathname+location.search);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({base:base,profiles:profiles,sel:sel}));}catch(e){}}
function cur(){for(var i=0;i<profiles.length;i++)if(profiles[i].id===sel)return profiles[i];return profiles[0];}

var nf=new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:0});
function kc(v){return (v<0?'−':'')+nf.format(Math.abs(Math.round(v))).replace(/ | /g,' ')+' Kč';}
function fmtIn(v,d){return new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:d||0,minimumFractionDigits:0}).format(v).replace(/ /g,' ');}
function parse(t){t=String(t).replace(/[\s  ]/g,'').replace(',','.').replace(/[^0-9.\-]/g,'');var n=parseFloat(t);return isFinite(n)?n:0;}
function sgn(v){return v<0?'neg':'pos';}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pmt(P,rate,years){
  var n=Math.round(years*12);if(P<=0||n<=0)return 0;
  var r=rate/1200;if(r===0)return P/n;
  return P*r/(1-Math.pow(1+r,-n));
}

function calc(p){
  var s={},k;for(k in base)s[k]=base[k];for(k in p.v)s[k]=p.v[k];
  var payNow=pmt(s.oldBal,s.oldRate,s.oldYears);
  var m=Math.max(0,Math.min(s.monthsFix,s.oldYears*12)),rr=s.oldRate/1200;
  var balFix=rr===0?s.oldBal-payNow*m:s.oldBal*Math.pow(1+rr,m)-payNow*(Math.pow(1+rr,m)-1)/rr;
  balFix=Math.max(0,balFix);
  var oldPay=pmt(balFix,s.rateAfter,s.oldYears-m/12);
  var cash=s.oldValue-s.sellCost-balFix;
  var need=s.price+s.reno;
  var loanA=Math.max(0,need-cash-s.usedA);
  var loanB=Math.max(0,need-s.usedB);
  var payA=pmt(loanA,s.rateA,s.term),payB=pmt(loanB,s.rateB,s.term);
  var rentNet=s.rent*s.occ/12-s.owner-s.repairs-s.tax;
  var A={loan:loanA,pay:payA,ins:s.insA,serv:s.newServ,oldPay:0,oldIns:0,oldServ:0,rent:0};
  var B={loan:loanB,pay:payB,ins:s.insB,serv:s.newServ,oldPay:oldPay,oldIns:s.oldInsAfter,oldServ:0,rent:rentNet};
  var C={loan:0,pay:0,ins:0,serv:0,oldPay:oldPay,oldIns:s.oldInsAfter,oldServ:s.oldServAfter,rent:0};
  A.debt=loanA;B.debt=loanB+balFix;C.debt=balFix;
  var D={loan:0,pay:0,ins:0,serv:0,oldPay:payNow,oldIns:s.oldIns,oldServ:s.oldServ,rent:0,debt:s.oldBal};
  A.cash=cash;
  A.savLeft=s.savings-s.usedA;B.savLeft=s.savings-s.usedB;C.savLeft=s.savings;D.savLeft=s.savings;
  [A,B,C,D].forEach(function(x){
    x.housing=x.pay+x.ins+x.serv+x.oldPay+x.oldIns+x.oldServ-x.rent;
    x.left=s.income-s.other-x.housing;
  });
  return {A:A,B:B,C:C,D:D,s:s,oldPay:oldPay,payNow:payNow,balFix:balFix,cash:cash,rentNet:rentNet};
}

var NAMES={D:'Dnes',A:'Prodat a koupit',B:'Koupit a pronajímat',C:'Zůstat'};
var ORDER=['D','C','A','B'];
var cardsEl=document.getElementById('cards'),outEl=document.getElementById('out'),chipsEl=document.getElementById('chips');

function render(){
  var P=cur(),R=calc(P),S=R.s;
  var best=R.A.left===R.B.left?'':(R.A.left>R.B.left?'A':'B');
  var desc={
    A:'Nová hypotéka '+kc(R.A.loan),
    D:'Starý byt, hypotéka '+kc(S.oldBal),
    B:'Nová hypotéka '+kc(R.B.loan)+' a stará '+kc(R.balFix),
    C:'Jen stará hypotéka '+kc(R.balFix)
  };
  var h='';
  ORDER.forEach(function(k){
    var x=R[k];
    h+='<div class="card '+k+'"><h3>'+NAMES[k]+'</h3><div class="d">'+desc[k]+'</div>'+
       '<div class="cap">Zbývá měsíčně</div><div class="big '+sgn(x.left)+'">'+kc(x.left)+'</div>'+
       '<div class="small">Bydlení celkem '+kc(x.housing)+(k===best?' · z koupě vychází líp':'')+'</div></div>';
  });
  cardsEl.innerHTML=h;

  var t='';
  /* porovnání všech profilů */
  t+='<div><h2>Porovnání profilů</h2><div class="scroll"><table style="min-width:0"><thead><tr><th>Nemovitost</th><th>Cena</th>'+
    '<th style="--k:var(--a)"><i></i>Prodat a koupit</th><th style="--k:var(--b)"><i></i>Koupit a pronajímat</th></tr></thead><tbody>';
  profiles.forEach(function(p){
    var r=calc(p);
    t+='<tr class="pick'+(p.id===P.id?' on':'')+'" data-id="'+p.id+'" tabindex="0"><td>'+esc(p.name)+'</td><td>'+kc(p.v.price)+'</td>'+
       '<td><span class="'+sgn(r.A.left)+'">'+kc(r.A.left)+'</span><div class="small">hypotéka '+kc(r.A.loan)+'</div></td>'+
       '<td><span class="'+sgn(r.B.left)+'">'+kc(r.B.left)+'</span><div class="small">hypotéka '+kc(r.B.loan)+'</div></td></tr>';
  });
  t+='</tbody></table></div><p class="note" style="margin-top:6px">Zbývá měsíčně. Dnes '+kc(R.D.left)+', při setrvání ve starém bytě po refixaci '+kc(R.C.left)+' měsíčně. Kliknutím na řádek profil vybereš.</p></div>';

  /* měsíční rozpočet vybraného profilu */
  t+='<div><h2>Měsíční rozpočet: '+esc(P.name)+'</h2><div class="scroll"><table><thead><tr><th></th>'+
    ORDER.map(function(k){return '<th style="--k:var(--'+k.toLowerCase()+')"><i></i>'+NAMES[k]+'</th>';}).join('')+'</tr></thead><tbody>';
  function tr(l,fn,cls){t+='<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+ORDER.map(function(k){return '<td>'+fn(R[k],k)+'</td>';}).join('')+'</tr>';}
  function sec(l){t+='<tr class="sec"><td colspan="5">'+l+'</td></tr>';}
  function dash(v){return v?kc(v):'–';}
  sec('Příjem a výdaje');
  tr('Čistý příjem domácnosti',function(){return kc(S.income);});
  tr('Ostatní výdaje',function(){return kc(-S.other);});
  sec('Nový byt');
  tr('Splátka nové hypotéky',function(x){return dash(x.pay);});
  tr('Pojištění nové hypotéky',function(x){return dash(x.ins);});
  tr('Zálohy, energie a pojištění bytu',function(x){return dash(x.serv);});
  sec('Starý byt');
  tr('Splátka staré hypotéky',function(x){return dash(x.oldPay);});
  tr('Pojištění staré hypotéky',function(x){return dash(x.oldIns);});
  tr('Zálohy, energie a garáž',function(x){return dash(x.oldServ);});
  tr('Součet před odečtením pronájmu',function(x){return kc(x.housing+x.rent);});
  tr('Příjem z pronájmu po nákladech',function(x){return x.rent?kc(-x.rent):'–';});
  tr('Bydlení celkem',function(x){return kc(x.housing);},'tot');
  tr('Zbývá měsíčně',function(x){return '<span class="'+sgn(x.left)+'">'+kc(x.left)+'</span>';},'tot');
  sec('Dluh a úspory');
  tr('Dluh celkem',function(x){return kc(x.debt);});
  tr('Úspory po koupi',function(x){return '<span class="'+(x.savLeft<0?'neg':'')+'">'+kc(x.savLeft)+'</span>';});
  function hyp(x){return x.pay+x.ins+x.oldPay+x.oldIns;}
  function sm(l,fn){t+='<tr class="sm"><td>'+l+'</td>'+ORDER.map(function(k){var v=fn(R[k],k);return '<td>'+(v===null?'–':(v>=0?'+':'−')+kc(Math.abs(v)))+'</td>';}).join('')+'</tr>';}
  sec('Hypotéky a rozdíly');
  tr('Splátky všech hypoték vč. pojištění',function(x){return kc(hyp(x));});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:hyp(x)-hyp(R.D);});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:hyp(x)-hyp(R.A);});
  tr('Dluh na všech hypotékách',function(x){return kc(x.debt);});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.debt-R.D.debt;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.debt-R.A.debt;});
  tr('Zbývá měsíčně',function(x){return '<span class="'+sgn(x.left)+'">'+kc(x.left)+'</span>';});
  sm('rozdíl oproti dnes',function(x,k){return k==='D'?null:x.left-R.D.left;});
  sm('rozdíl oproti prodeji bytu',function(x,k){return (k==='D'||k==='A')?null:x.left-R.A.left;});
  t+='</tbody></table></div></div>';

  /* rozpis pronájmu */
  var rM=S.rent*S.occ/12,rY=S.rent*S.occ,opM=S.owner+S.repairs+S.tax,netBefore=rM-opM,mort=R.oldPay+S.oldInsAfter,netAfter=netBefore-mort;
  function row(l,mv,cls,neg){var v=neg?-mv:mv;var c=cls&&v<0?'neg':cls?'pos':'';return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td><td><span class="'+c+'">'+kc(v)+'</span></td><td><span class="'+c+'">'+kc(v*12)+'</span></td></tr>';}
  var tenSvj=Math.max(0,S.svjTotal-S.owner);
  t+='<div><h2>Pronájem starého bytu: rozpis</h2><div class="scroll"><table><thead><tr><th></th><th>Měsíčně</th><th>Ročně</th></tr></thead><tbody>';
  t+='<tr class="sec"><td colspan="3">Rozdělení záloh SVJ ('+kc(S.svjTotal)+' měsíčně)</td></tr>';
  t+='<tr><td>Platí vlastník, počítá se do nákladů pronájmu</td><td>'+kc(S.owner)+'</td><td>'+kc(S.owner*12)+'</td></tr>';
  t+='<tr><td>Platí nájemník nad rámec nájmu, tvým rozpočtem neprochází</td><td>'+kc(tenSvj)+'</td><td>'+kc(tenSvj*12)+'</td></tr>';
  t+='<tr class="sec"><td colspan="3">Příjem a náklady pronájmu</td></tr>';
  t+='<tr><td>Nájem '+kc(S.rent)+' × '+S.occ+' měsíců z 12</td><td>'+kc(rM)+'</td><td>'+kc(rY)+'</td></tr>';
  t+=row('Poplatky SVJ, které platí vlastník',S.owner,'',true)+row('Opravy a drobné náklady',S.repairs,'',true)+row('Daň z nájmu (odhad)',S.tax,'',true);
  t+=row('Příjem z pronájmu po nákladech',netBefore,'tot');
  t+='<tr class="sec"><td colspan="3">Hypotéka na starém bytě po refixaci</td></tr>';
  t+=row('Splátka hypotéky',R.oldPay,'',true)+row('Pojištění hypotéky',S.oldInsAfter,'',true);
  t+=row(netAfter>=0?'Pronájem ti měsíčně přispívá':'Na pronájem měsíčně doplácíš',netAfter,'tot');
  t+='</tbody></table></div><p class="note">Zálohy a energie ve starém bytě platí nájemník, proto tu nejsou. Pronájem je stejný pro všechny profily.</p></div>';

  /* graf */
  var vals=ORDER.map(function(k){return R[k].left;});
  var mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([0]));
  var W=520,L=150,Rr=100,bh=26,gap=16,H=4*(bh+gap)+8;
  var sc=(W-L-Rr)/(mx-mn||1),x0=L-mn*sc;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Kolik zbývá měsíčně v jednotlivých variantách">';
  svg+='<line x1="'+x0+'" x2="'+x0+'" y1="0" y2="'+H+'" stroke="var(--line)"/>';
  ORDER.forEach(function(k,i){
    var v=R[k].left,y=4+i*(bh+gap),w=Math.abs(v)*sc,x=v>=0?x0:x0-w;
    svg+='<text x="0" y="'+(y+bh/2+5)+'" font-size="13" fill="var(--ink)" font-family="var(--font)">'+NAMES[k]+'</text>';
    svg+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(w,1)+'" height="'+bh+'" rx="3" fill="var(--'+k.toLowerCase()+')"/>';
    var tx=v>=0?x0+w+6:x0+6;
    svg+='<text x="'+tx+'" y="'+(y+bh/2+5)+'" font-size="13" font-weight="600" fill="var(--ink)" font-family="var(--font)">'+kc(v)+'</text>';
  });
  svg+='</svg>';
  t+='<div class="chart"><h2>Kolik zbývá měsíčně: '+esc(P.name)+'</h2>'+svg+'</div>';

  /* shrnutí */
  var dBA=R.B.left-R.A.left;
  t+='<div class="verdict"><h2>Shrnutí: '+esc(P.name)+'</h2>';
  t+='<p>Splátka staré hypotéky vzroste po refixaci z <b>'+kc(R.payNow)+'</b> na <b>'+kc(R.oldPay)+'</b> měsíčně. Dnes ti po všech výdajích zbývá <b>'+kc(R.D.left)+'</b>.</p>';
  t+='<p>Z prodeje starého bytu zbude po doplacení hypotéky a nákladech <b>'+kc(R.cash)+'</b>. Tento byt s vybavením stojí <b>'+kc(S.price+S.reno)+'</b>.</p>';
  t+='<p>Když starý byt necháš a pronajmeš, zbývá měsíčně o <b>'+kc(Math.abs(dBA))+'</b> '+(dBA>=0?'víc':'méně')+' než při prodeji. Dluh je přitom o <b>'+kc(Math.abs(R.B.debt-R.A.debt))+'</b> '+(R.B.debt>=R.A.debt?'vyšší':'nižší')+'.</p>';
  if(R.A.savLeft<0||R.B.savLeft<0)t+='<p class="neg">Do koupě vkládáš víc, než kolik máš úspor.</p>';
  t+='<p class="note">Varianty počítají s tím, že fixace staré hypotéky skončila. Výsledky jsou orientační a nenahrazují nabídku banky.</p></div>';
  outEl.innerHTML=t;
}

/* čipy profilů */
function renderChips(){
  var h='';
  profiles.forEach(function(p){h+='<button type="button" class="chip" data-id="'+p.id+'" aria-pressed="'+(p.id===sel)+'">'+esc(p.name)+'</button>';});
  h+='<button type="button" class="chip add" id="addP">+ Nový profil</button>';
  chipsEl.innerHTML=h;
}

/* vstupy */
var inEl=document.getElementById('inputs');
function fieldHtml(f,scope){
  return '<label class="f"><span class="l">'+f[1]+'</span><span class="in"><input data-s="'+scope+'" data-k="'+f[0]+'" inputmode="decimal" autocomplete="off" data-d="'+(scope==='p'?(f[3]||0):(f[4]||0))+'"><span class="u">'+f[2]+'</span></span></label>';
}
function build(){
  var h='<fieldset class="prof"><legend>Nemovitost ke koupi</legend>'+
    '<label class="f col"><span class="l">Název profilu</span><span class="in"><input class="txt" id="pname" autocomplete="off" maxlength="60"></span></label>'+
    '<label class="f col"><span class="l">Poznámka (adresa, odkaz, na co si dát pozor)</span><span class="in"><input class="txt" id="pnote" autocomplete="off" maxlength="200"></span></label>'+
    PF.map(function(f){return fieldHtml(f,'p');}).join('')+
    '<div class="pbtns"><button type="button" id="dup">Duplikovat profil</button><button type="button" id="zero">Vynulovat čísla</button><button type="button" id="del" class="danger">Smazat profil</button></div></fieldset>';
  h+='<details class="common"><summary>Společné údaje: domácnost, starý byt, pronájem</summary><div>';
  BG.forEach(function(g){
    h+='<fieldset><legend>'+g.t+'</legend>'+g.f.map(function(f){return fieldHtml(f,'b');}).join('')+'</fieldset>';
  });
  h+='</div></details>';
  inEl.innerHTML=h;
}
function fill(){
  var P=cur();
  document.getElementById('pname').value=P.name;
  document.getElementById('pnote').value=P.note;
  inEl.querySelectorAll('input[data-k]').forEach(function(el){
    var v=el.dataset.s==='p'?P.v[el.dataset.k]:base[el.dataset.k];
    el.value=fmtIn(v,+el.dataset.d);
  });
}
function refreshAll(){renderChips();fill();render();}

inEl.addEventListener('input',function(e){
  var el=e.target,P=cur();
  if(el.id==='pname'){P.name=el.value.slice(0,60)||'Profil';save();renderChips();render();return;}
  if(el.id==='pnote'){P.note=el.value;save();return;}
  if(!el.dataset.k)return;
  (el.dataset.s==='p'?P.v:base)[el.dataset.k]=parse(el.value);
  save();render();
});
inEl.addEventListener('focusin',function(e){if(e.target.tagName==='INPUT')e.target.select();});
inEl.addEventListener('focusout',function(e){
  var el=e.target;if(!el.dataset||!el.dataset.k)return;
  var v=el.dataset.s==='p'?cur().v[el.dataset.k]:base[el.dataset.k];
  el.value=fmtIn(v,+el.dataset.d);
});

function select(id){sel=id;save();refreshAll();}
chipsEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='addP'){
    var v={};PIDS.forEach(function(k){v[k]=0;});
    v.reno=cur().v.reno;v.term=cur().v.term;v.usedA=cur().v.usedA;v.usedB=cur().v.usedB;
    v.rateA=cur().v.rateA;v.rateB=cur().v.rateB;
    var p={id:nextId++,name:'Nový profil '+(profiles.length+1),note:'',v:v};
    profiles.push(p);select(p.id);setStatus('Přidán prázdný profil. Vyplň cenu, zálohy a pojištění. Úrok, splatnost a vlastní peníze jsou převzaté z předchozího.');
    document.getElementById('pname').focus();document.getElementById('pname').select();
    return;
  }
  select(+b.dataset.id);
});
outEl.addEventListener('click',function(e){var r=e.target.closest('tr.pick');if(r)select(+r.dataset.id);});
outEl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var r=e.target.closest&&e.target.closest('tr.pick');if(r){e.preventDefault();select(+r.dataset.id);}}});

var st=document.getElementById('status');
function setStatus(m){st.textContent=m;}
var delTimer=null;
inEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='dup'){
    var P=cur(),v={};PIDS.forEach(function(k){v[k]=P.v[k];});
    var p={id:nextId++,name:P.name+' (kopie)',note:P.note,v:v};
    profiles.push(p);select(p.id);setStatus('Profil zduplikován. Přepiš v něm, co se liší.');
  }else if(b.id==='zero'){
    PIDS.forEach(function(k){cur().v[k]=0;});save();fill();render();setStatus('Čísla profilu jsou vynulovaná.');
  }else if(b.id==='del'){
    if(profiles.length<2){setStatus('Poslední profil nejde smazat. Můžeš ho přepsat nebo vynulovat.');return;}
    if(b.dataset.arm){
      clearTimeout(delTimer);var id=cur().id;
      profiles=profiles.filter(function(p){return p.id!==id;});sel=profiles[0].id;save();refreshAll();setStatus('Profil smazán.');
    }else{
      b.dataset.arm='1';b.textContent='Opravdu smazat?';
      delTimer=setTimeout(function(){b.removeAttribute('data-arm');b.textContent='Smazat profil';},3000);
    }
  }
});

document.getElementById('demo').addEventListener('click',function(){
  base=JSON.parse(JSON.stringify(BDEF));profiles=seed();sel=1;nextId=4;save();refreshAll();
  setStatus('Vrácena ukázka se třemi profily a výchozími společnými údaji.');
});
document.getElementById('share').addEventListener('click',function(){
  var url=location.href.split('#')[0]+'#d='+btoa(unescape(encodeURIComponent(JSON.stringify({base:base,profiles:profiles,sel:sel}))));
  var fb=function(){setStatus('Zkopíruj odkaz ručně: '+url);};
  try{navigator.clipboard.writeText(url).then(function(){setStatus('Odkaz se všemi profily je zkopírovaný. Kdo ho otevře, uvidí tato čísla.');},fb);}catch(e){fb();}
});

save();build();refreshAll();
setStatus('Ukázkové profily Silurská, Sazovická a Kutrovická. Úroky, zálohy a pojištění jsou odhad, přepiš je podle nabídky.');
})();
</script>
</body></html>
